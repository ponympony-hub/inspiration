<script>
    // ── 全局 fetch 限流重试：HTTP 429（Too Many Requests）自动指数退避重试，最多 3 次 ──
    // 对所有接口统一生效（行情 / K线 / Alpha / Gist 同步），避免限流导致的数据缺失
    (function () {
        const __origFetch = window.fetch.bind(window);
        const MAX_RETRY = 3;
        window.fetch = async function (url, options) {
            for (let attempt = 0; ; attempt++) {
                let resp;
                try {
                    resp = await __origFetch(url, options);
                } catch (e) {
                    if (attempt >= MAX_RETRY - 1) throw e;
                    const wait = 500 * Math.pow(2, attempt) + Math.random() * 400;
                    await new Promise(r => setTimeout(r, wait));
                    continue;
                }
                if (resp.status === 429 && attempt < MAX_RETRY - 1) {
                    const wait = 800 * Math.pow(2, attempt) + Math.random() * 600;
                    console.warn('[retry] HTTP 429 限流，' + Math.round(wait) + 'ms 后重试 (' + (attempt + 1) + '/' + (MAX_RETRY - 1) + '): ' + (typeof url === 'string' ? url : String(url)));
                    await new Promise(r => setTimeout(r, wait));
                    continue;
                }
                return resp;
            }
        };
    })();

    // ── 亮/暗主题切换 ────────────────────────────────────────────
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        const btn = document.getElementById('themeToggleBtn');
        if (btn) btn.textContent = theme === 'dark' ? '☀️ 亮色' : '🌙 暗色';
    }

    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        localStorage.setItem('uex-theme', next);
        if (typeof autoSyncSettingsToGist === 'function') autoSyncSettingsToGist();
    }

    applyTheme(localStorage.getItem('uex-theme') || 'light');

    // ── 列定义 ────────────────────────────────────────────────────
    const ALL_COLS = [
        { key: 'symbol',  label: '标的',      width: 110, sortField: null },
        { key: 'price',   label: '价格',   width: 100, sortField: 'price' },
        { key: 'change',  label: '涨跌幅',     width: 110, sortField: 'change' },
        { key: 'amp',     label: '振幅',       width: 100, sortField: 'amp' },
        { key: 'vol',     label: '成交额',     width: 100, sortField: 'vol' },
        { key: 'mktcap',  label: '市值 ($)',   width: 100, sortField: 'mktcap' },
        { key: 'high',    label: '24h 最高价', width: 100, sortField: null },
        { key: 'low',     label: '24h 最低价', width: 100, sortField: null },
        { key: 'detail',  label: '自定义',     width: 70,  sortField: null },
    ];

    let visibleCols = ALL_COLS.map(c => c.key);
    function getCol(key) { return ALL_COLS.find(c => c.key === key) || CUSTOM_COLS.find(c => c.key === key); }

    // ── 复制列（价格换算列） ─────────────────────────────────────
    let CUSTOM_COLS = []; // { key, baseKey: 'price', coef, headerColor, label, width, sortField: null }
    let customColSeq = 1;

    function decimalsForPrice(v) { return v >= 1000 ? 2 : v >= 1 ? 4 : 8; }

    function createCustomPriceCol(coef = 0.8) {
        const key = `custom_${customColSeq++}`;
        const col = { key, baseKey: 'price', coef, headerColor: '', label: `价格×${coef}`, width: 100, sortField: null };
        CUSTOM_COLS.push(col);
        return col;
    }

    // ── 排序状态 ──────────────────────────────────────────────────
    let sortKey = 'amp';
    let sortDir = 1;

    // ── 标的列表：每个条目是 { id, sym, exchange }
    //    id = sym + '@' + exchange（唯一键），exchange='' 表示自动
    let rows = [
    'BOME', 'BCH', 'PEPE', 'ETC', 'RATS', 'TRUMP', 'ENA', 'AAVE', 'XRP', 'ZEC',
    'RSKHY', 'SKHY', 'SKHYNIX', 'DOGE', 'GRAM', 'ONDO', 'MRVL', 'PONS', 'ARB',
    'SHIB', 'PREOPAI', '币安人生', 'OKB', 'ARTX', 'DYDX', 'NVDA', 'SPCX', 'OP',
    'SOL', 'BTC', 'ETH', 'BGB', 'BNB', 'HYPE', 'UNI', 'SUI', 'TSLA', 'AAPL', 'MU', 'SNDK', 'GOOGL'
    ].map(s => ({ id: s + '@auto', sym: s, exchange: '', pinned: ['BTC', 'ETH', 'BGB'].includes(s) }));

    // 别名映射（显示名 → 实际 API symbol）
    const SYMBOL_ALIAS = {};
    function apiSym(sym) { return SYMBOL_ALIAS[sym] || sym; }

    // cache 以 id 为键
    const cache = {};
    const DYNAMIC_SUPPLY = {};

    // ── 交易所 K线页面 URL 生成 ───────────────────────────────────
    function getChartUrl(sym, exchange, alphaSymbol) {
        const s = apiSym(sym).toUpperCase();
        const ex = exchange || 'bitget';
        switch (ex) {
            case 'bitget':        return `https://www.bitget.com/spot/${s}USDT`;
            case 'binance':       return `https://www.binance.com/zh-CN/trade/${s}_USDT`;
            case 'binance-chain': {
                // 链上K线用 dex.binance.com 或 pancakeswap
                const alphaSym = alphaSymbol || '';
                return alphaSym
                    ? `https://www.binance.com/zh-CN/alpha`
                    : `https://pancakeswap.finance/swap`;
            }
            case 'okx':     return `https://www.okx.com/trade-spot/${s.toLowerCase()}-usdt`;
            case 'gate':    return `https://www.gate.io/trade/${s}_USDT`;
            case 'mexc':    return `https://www.mexc.com/zh-CN/exchange/${s}_USDT`;
            case 'futures': return `https://www.bitget.com/futures/usdt/${s}USDT`;
            default:        return `https://www.bitget.com/spot/${s}USDT`;
        }
    }

    // ── 数字格式化 ────────────────────────────────────────────────
    function trimZeros(str) {
        if (!str.includes('.')) return str;
        return str.replace(/\.?0+$/, '');
    }

    function compactPrice(numStr) {
        const s = trimZeros(numStr);
        const m = s.match(/^(0\.)(0{4,})(\d+)$/);
        if (!m) return s;
        return `0.{${m[2].length}}${m[3]}`;
    }

    function fmtPrice(numStr) { return compactPrice(trimZeros(numStr)); }

    function fmtVol(val) {
        if (!val && val !== 0) return '--';
        if (val >= 100000000) return (val / 100000000).toFixed(1) + ' 万亿';
        if (val >= 10000) return (val / 10000).toFixed(1) + ' 亿';
        return val.toFixed(1) + ' 万';
    }

    function fmtMktcap(val) {
        if (!val && val !== 0) return '--';
        if (val >= 100000000) return (val / 100000000).toFixed(1) + ' 万亿';
        if (val >= 10000) return (val / 10000).toFixed(1) + ' 亿';
        return val.toFixed(1) + ' 万';
    }

    function fmtNum(v, digits = 2) {
        if (v == null || isNaN(v)) return '--';
        if (v >= 1e9)  return (v / 1e9).toFixed(digits) + 'B';
        if (v >= 1e6)  return (v / 1e6).toFixed(digits) + 'M';
        if (v >= 1e3)  return (v / 1e3).toFixed(digits) + 'K';
        return v.toFixed(digits);
    }

    // ── 来源标签 ──────────────────────────────────────────────────
    const SOURCE_LABEL  = { spot: 'BG', futures: '合约', binance: '币安', 'binance-chain': '链上', okx: 'OKX', gate: 'Gate', mexc: '抹茶', us: '美股', hk: '港股', cn: 'A股' };
    const SOURCE_COLOR  = { spot: '#0f6fff', futures: '#e67e00', binance: '#b38600', 'binance-chain': '#7c3aed', okx: '#0f6fff', gate: '#1a99cc', mexc: '#1e80ff', us: '#c0392b', hk: '#cc0000', cn: '#d4380d' };
    const SOURCE_BG     = { spot: '#e8f0ff', futures: '#fff4e5', binance: '#fffbea', 'binance-chain': '#ede9fe', okx: '#e8f0ff', gate: '#e0f7fa', mexc: '#e8f3ff', us: '#fdecea', hk: '#fdecea', cn: '#fff1ee' };
    const SOURCE_BORDER = { spot: '#aac8ff', futures: '#ffd591', binance: '#ffe58f', 'binance-chain': '#c4b5fd', okx: '#aac8ff', gate: '#80d8ea', mexc: '#93c5fd', us: '#f5b7b1', hk: '#f5b7b1', cn: '#ffb8a0' };

    // ── 各来源原始接口字段名（悬浮提示用） ───────────────────────
    const FIELD_NAME_MAP = {
        spot:    { symbol: 'symbol', price: 'lastPr', change: 'changeUtc24h', amp: 'high24h/low24h/open', vol: 'quoteVolume', mktcap: '计算值(price×流通量)', high: 'high24h', low: 'low24h' },
        futures: { symbol: 'symbol', price: 'lastPr', change: 'openUtc/changeUtc24h', amp: 'high24h/low24h/open24h', vol: 'quoteVolume', mktcap: '计算值(price×流通量)', high: 'high24h', low: 'low24h' },
        binance: { symbol: 'symbol', price: 'lastPrice', change: 'priceChangePercent', amp: 'highPrice/lowPrice/openPrice', vol: 'quoteVolume', mktcap: '计算值(price×流通量)', high: 'highPrice', low: 'lowPrice' },
        okx:     { symbol: 'instId', price: 'last', change: 'open24h(计算)', amp: 'high24h/low24h/open24h', vol: 'volCcy24h', mktcap: '计算值(price×流通量)', high: 'high24h', low: 'low24h' },
        gate:    { symbol: 'currency_pair', price: 'last', change: 'change_percentage', amp: 'high_24h/low_24h/open_24h', vol: 'quote_volume', mktcap: '计算值(price×流通量)', high: 'high_24h', low: 'low_24h' },
        mexc:    { symbol: 'symbol', price: 'lastPrice', change: 'priceChangePercent', amp: 'highPrice/lowPrice/openPrice', vol: 'quoteVolume', mktcap: '计算值(price×流通量)', high: 'highPrice', low: 'lowPrice' },
        'binance-chain': { symbol: 'symbol', price: 'lastPrice', change: 'priceChangePercent', amp: 'highPrice/lowPrice/openPrice', vol: 'quoteVolume', mktcap: 'marketCap/fullyDilutedValuation', high: 'highPrice', low: 'lowPrice' },
        us: { symbol: 'symbol', price: 'regularMarketPrice', change: '计算值', amp: '计算值', vol: 'regularMarketVolume', mktcap: '计算值', high: 'regularMarketDayHigh', low: 'regularMarketDayLow' },
        hk: { symbol: 'symbol', price: 'price', change: '计算值', amp: '计算值', vol: '计算值', mktcap: '计算值', high: 'high', low: 'low' },
        cn: { symbol: 'symbol', price: 'price', change: '计算值', amp: '计算值', vol: '计算值', mktcap: '计算值', high: 'high', low: 'low' },
    };

    function fieldTitle(src, key) {
        const m = FIELD_NAME_MAP[src];
        return (m && m[key]) || getCol(key).label;
    }

    function srcTag(src) {
        const label = SOURCE_LABEL[src] || '';
        if (!label) return '';
        return `<span style="display:inline-block;font-size:10px;font-weight:500;color:${SOURCE_COLOR[src]};background:${SOURCE_BG[src]};border:1px solid ${SOURCE_BORDER[src]};border-radius:3px;padding:1px 5px;vertical-align:middle;line-height:1.4">${label}</span>`;
    }

    // ── 列拖拽排序 ────────────────────────────────────────────────
    let _dragSrcKey = null;

    function onColDragStart(e, key) {
        _dragSrcKey = key;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', key);
    }

    function onColDragOver(e, key) {
        if (!_dragSrcKey || _dragSrcKey === key) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        document.querySelectorAll('#theadRow th').forEach(th => th.classList.remove('col-drag-over'));
        const idx = visibleCols.indexOf(key);
        const ths = document.querySelectorAll('#theadRow th');
        if (ths[idx]) ths[idx].classList.add('col-drag-over');
    }

    function onColDragLeave(e) { e.currentTarget.classList.remove('col-drag-over'); }

    function onColDrop(e, key) {
        e.preventDefault();
        document.querySelectorAll('#theadRow th').forEach(th => th.classList.remove('col-drag-over'));
        if (!_dragSrcKey || _dragSrcKey === key) return;
        if (_dragSrcKey === 'symbol' || key === 'symbol') return;
        const fromIdx = visibleCols.indexOf(_dragSrcKey);
        const toIdx   = visibleCols.indexOf(key);
        if (fromIdx < 0 || toIdx < 0) return;
        visibleCols.splice(fromIdx, 1);
        visibleCols.splice(toIdx, 0, _dragSrcKey);
        _dragSrcKey = null;
        renderHeader();
        renderTable();
    }

    function onColDragEnd() {
        _dragSrcKey = null;
        document.querySelectorAll('#theadRow th').forEach(th => th.classList.remove('col-drag-over'));
    }

    // ── 表头渲染 ──────────────────────────────────────────────────
    function renderHeader() {
        const tr = document.getElementById('theadRow');
        tr.innerHTML = visibleCols.map(key => {
            const col = getCol(key);
            const isSortable = !!col.sortField;
            const isActive   = sortKey === col.sortField;
            const arrow      = isActive ? (sortDir === 1 ? ' ▼' : ' ▲') : '';
            const sortClass  = isSortable ? 'sortable' : '';
            const activeClass= isActive   ? 'col-active' : '';
            const onclick    = isSortable ? `onclick="setSort('${col.sortField}')"` : '';
            const draggable  = key !== 'symbol' ? 'draggable="true"' : '';
            const dragEvents = key !== 'symbol'
                ? `ondragstart="onColDragStart(event,'${key}')" ondragover="onColDragOver(event,'${key}')" ondragleave="onColDragLeave(event)" ondrop="onColDrop(event,'${key}')" ondragend="onColDragEnd()"`
                : `ondragover="onColDragOver(event,'${key}')" ondrop="onColDrop(event,'${key}')"`;
            const delBtn = key !== 'symbol'
                ? `<span class="col-del" title="隐藏此列" onclick="removeCol('${key}');event.stopPropagation()">✕</span>`
                : '';
            const bgStyle = col.headerColor ? `background:${col.headerColor};` : '';
            return `<th class="${sortClass} ${activeClass}" style="width:${col.width}px;${bgStyle}" ${onclick} ${draggable} ${dragEvents}>` +
                   `<div class="th-inner">${col.label}${arrow ? `<span style="font-size:11px">${arrow}</span>` : ''}</div>` +
                   `${delBtn}` +
                   `<div class="resize-handle" onmousedown="startResize(event,'${key}')"></div>` +
                   `</th>`;
        }).join('');
    }

    // ── 列排序 ────────────────────────────────────────────────────
    function setSort(key) {
        if (sortKey === key) sortDir = -sortDir;
        else { sortKey = key; sortDir = 1; }
        renderHeader();
        renderTable();
    }

    function sortedRows() {
        const base = sortKey === 'default' ? [...rows] : [...rows].sort((a, b) => {
            const da = cache[a.id], db = cache[b.id];
            if (!da && !db) return 0;
            if (!da) return 1;
            if (!db) return -1;
            const va = da[sortKey] ?? -Infinity;
            const vb = db[sortKey] ?? -Infinity;
            return (vb - va) * sortDir;
        });
        const pinned = base.filter(r => r.pinned);
        const rest   = base.filter(r => !r.pinned);
        return [...pinned, ...rest];
    }

    // ── 置顶 ──────────────────────────────────────────────────────
    function togglePin(id) {
        const r = rows.find(x => x.id === id);
        if (r) { r.pinned = !r.pinned; renderTable(); autoSyncSettingsToGist(); }
    }

    // ── 标的右键菜单（置顶 / 删除） ───────────────────────────────
    function openRowCtxMenu(e, id) {
        e.preventDefault();
        e.stopPropagation();
        const row = rows.find(r => r.id === id);
        if (!row) return;
        const menu = document.getElementById('rowCtxMenu');
        const noteCount = getNotes(row.sym).length;
        menu.innerHTML =
            `<div class="ctx-item" onclick="togglePin('${id}');closeRowCtxMenu()">${row.pinned ? '取消置顶' : '置顶'}</div>` +
            `<div class="ctx-item" onclick="openNotesModal('${row.sym}');closeRowCtxMenu()">笔记${noteCount ? ` (${noteCount})` : ''}</div>` +
            `<div class="ctx-item danger" onclick="removeRow('${id}');closeRowCtxMenu()">删除</div>`;
        menu.style.display = 'block';
        const menuW = menu.offsetWidth, menuH = menu.offsetHeight;
        const x = Math.min(e.clientX, window.innerWidth - menuW - 8);
        const y = Math.min(e.clientY, window.innerHeight - menuH - 8);
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
    }

    function closeRowCtxMenu() {
        document.getElementById('rowCtxMenu').style.display = 'none';
    }

    document.addEventListener('click', (e) => {
        const menu = document.getElementById('rowCtxMenu');
        if (menu && menu.style.display !== 'none' && !menu.contains(e.target)) closeRowCtxMenu();
        const qmenu = document.getElementById('quickLinkCtxMenu');
        if (qmenu && qmenu.style.display !== 'none' && !qmenu.contains(e.target)) closeQuickLinkCtxMenu();
    });
    document.addEventListener('contextmenu', (e) => {
        const menu = document.getElementById('rowCtxMenu');
        if (menu && menu.style.display !== 'none' && !menu.contains(e.target)) closeRowCtxMenu();
        const qmenu = document.getElementById('quickLinkCtxMenu');
        if (qmenu && qmenu.style.display !== 'none' && !qmenu.contains(e.target)) closeQuickLinkCtxMenu();
    });
    document.addEventListener('scroll', closeRowCtxMenu, true);

    // ── K线详情面板（下拉选择区间，支持天/月两种粒度） ─────────────
    // value 用 '<unit>:<count>' 编码，如 'day:7'、'month:1'、'month:6'
    const DETAIL_RANGE_PRESETS = [
        { unit: 'day',   count: 7,  label: '7 天' },
        { unit: 'month', count: 1,  label: '1 个月' },
        { unit: 'month', count: 3,  label: '3 个月' },
        { unit: 'month', count: 6,  label: '半年' },
        { unit: 'month', count: 12, label: '1 年' },
        { unit: 'month', count: 24, label: '2 年' },
        { unit: 'month', count: 36, label: '3 年' },
        { unit: 'month', count: 48, label: '4 年' },
    ];
    const KLINE_FETCHERS = {
        spot: fetchKlineBitgetSpot,
        futures: fetchKlineBitgetFutures,
        binance: fetchKlineBinance,
        okx: fetchKlineOKX,
        gate: fetchKlineGate,
        mexc: fetchKlineMexc,
        'binance-chain': fetchKlineBinanceAlpha,
    };
    const KLINE_UNSUPPORTED = { us: '美股暂不支持K线详情', hk: '港股暂不支持K线详情', cn: 'A股暂不支持K线详情' };

    // ── 各来源K线粒度参数映射（天/周/月） ───────────────────────────
    const KLINE_GRANULARITY_BITGET_SPOT    = { day: '1day', week: '1week', month: '1M' };
    const KLINE_GRANULARITY_BITGET_FUTURES = { day: '1D',   week: '1W',    month: '1M' };
    const KLINE_GRANULARITY_BINANCE        = { day: '1d',   week: '1w',    month: '1M' };
    const KLINE_GRANULARITY_OKX            = { day: '1D',   week: '1W',    month: '1M' };
    // Gate.io 无自然周/月粒度K线，用其最大bucket 7d/30d 近似（会与自然周期产生轻微偏差）
    const KLINE_GRANULARITY_GATE           = { day: '1d',   week: '7d',    month: '30d' };
    const KLINE_GRANULARITY_ALPHA          = { day: '1d',   week: '1w',    month: '1M' };

    function rangeUnitLabel(unit) { return unit === 'month' ? '个月' : unit === 'week' ? '周' : '天'; }

    let detailState = { id: null, unit: 'day', count: 7, custom: false };

    function resolveDetailSource(row) {
        const d = cache[row.id];
        if (d && d.source) return d.source;
        if (row.exchange === 'bitget') return 'spot';
        if (row.exchange === 'bitget-futures') return 'futures';
        if (row.exchange) return row.exchange;
        return 'spot';
    }

    function openDetail(id) {
        const row = rows.find(r => r.id === id);
        if (!row) return;
        detailState = { id, unit: 'day', count: 7, custom: false };
        document.getElementById('detailTitle').textContent = `${row.sym} K线详情`;
        document.getElementById('detailModal').style.display = 'flex';
        renderDetailRangeGroup();
        loadDetailKline();
    }

    function closeDetail() {
        document.getElementById('detailModal').style.display = 'none';
        detailState = { id: null, unit: 'day', count: 7, custom: false };
    }

    function renderDetailRangeGroup() {
        const el = document.getElementById('detailRangeGroup');
        const options = DETAIL_RANGE_PRESETS.map(p => {
            const selected = !detailState.custom && detailState.unit === p.unit && detailState.count === p.count ? 'selected' : '';
            return `<option value="${p.unit}:${p.count}" ${selected}>${p.label}</option>`;
        }).join('');
        el.innerHTML =
            `<select id="detailRangeSelect" onchange="onDetailRangeSelect(this.value)">` +
            options +
            `<option value="custom" ${detailState.custom ? 'selected' : ''}>自定义…</option>` +
            `</select>` +
            (detailState.custom
                ? `<input type="number" id="detailCustomCount" min="1" max="3650" value="${detailState.count}" style="width:64px">` +
                  `<select id="detailCustomUnit">` +
                    `<option value="day" ${detailState.unit === 'day' ? 'selected' : ''}>天</option>` +
                    `<option value="month" ${detailState.unit === 'month' ? 'selected' : ''}>月</option>` +
                  `</select>` +
                  `<button class="sort-btn" onclick="applyCustomRange()">查询</button>`
                : '');
    }

    function onDetailRangeSelect(value) {
        if (value === 'custom') {
            detailState.custom = true;
            renderDetailRangeGroup();
            return;
        }
        const [unit, count] = value.split(':');
        detailState = { ...detailState, unit, count: parseInt(count), custom: false };
        renderDetailRangeGroup();
        loadDetailKline();
    }

    function applyCustomRange() {
        const count = parseInt(document.getElementById('detailCustomCount').value) || 0;
        const unit = document.getElementById('detailCustomUnit').value;
        if (count < 1) return;
        detailState.unit = unit;
        detailState.count = count;
        loadDetailKline();
    }

    async function loadDetailKline() {
        const { id, unit, count } = detailState;
        const row = rows.find(r => r.id === id);
        const body = document.getElementById('detailBody');
        if (!row) return;
        body.innerHTML = `<div class="detail-tip">加载中...</div>`;

        const src = resolveDetailSource(row);
        if (KLINE_UNSUPPORTED[src]) {
            body.innerHTML = `<div class="detail-tip">${KLINE_UNSUPPORTED[src]}</div>`;
            return;
        }
        const fetcher = KLINE_FETCHERS[src];
        if (!fetcher) {
            body.innerHTML = `<div class="detail-tip">该来源暂不支持K线详情</div>`;
            return;
        }

        const s = apiSym(row.sym);
        const candles = await fetcher(s, unit, count);
        if (detailState.id !== id || detailState.unit !== unit || detailState.count !== count) return; // 期间用户已切换，丢弃过期结果

        const stats = computeRangeStats(candles);
        if (!stats) {
            body.innerHTML = `<div class="detail-tip">查询失败，请稍后重试</div>`;
            return;
        }

        const unitLabel = rangeUnitLabel(unit);
        const priceDecimals = stats.high >= 1000 ? 2 : stats.high >= 1 ? 4 : 8;
        const coverageTip = stats.count < count
            ? `<div class="detail-tip">该来源仅返回 ${stats.count} ${unitLabel}数据（请求 ${count} ${unitLabel}）</div>`
            : '';
        body.innerHTML =
            `<div class="detail-row"><span class="detail-label">来源</span><span>${srcTag(src)}</span></div>` +
            `<div class="detail-row"><span class="detail-label">区间</span><span>最近 ${stats.count} ${unitLabel}</span></div>` +
            `<div class="detail-row"><span class="detail-label">最高价</span><span class="high-val">${stats.high.toFixed(priceDecimals)}</span></div>` +
            `<div class="detail-row"><span class="detail-label">最低价</span><span class="low-val">${stats.low.toFixed(priceDecimals)}</span></div>` +
            `<div class="detail-row"><span class="detail-label">振幅</span><span style="font-weight:700;color:var(--amp-warn-text)">${stats.amp.toFixed(2)}%</span></div>` +
            coverageTip;
    }

    // ── 指标趋势 Modal（点击"价格/涨跌幅/振幅/成交额/市值"单元格弹出，天/周/月可切换，周期数可修改） ──
    // 每个指标定义：如何从一根K线（结合上一根、上下文）算出该点的值，以及展示用的格式化方式
    const METRIC_DEFS = {
        vol:    { label: '成交额', baseline: 0,
                  extractor: c => c.vol || 0,
                  fmtVal: v => fmtVol(v), fmtShort: v => fmtVolShort(v) },
        price:  { label: '价格', baseline: null,
                  extractor: c => c.close,
                  fmtVal: v => fmtPrice(v.toFixed(decimalsForPrice(v))), fmtShort: v => fmtPrice(v.toFixed(decimalsForPrice(v))) },
        change: { label: '涨跌幅', baseline: null, unit: '%',
                  extractor: (c, i, arr) => {
                      const prevClose = i === 0 ? c.open : arr[i - 1].close;
                      return prevClose > 0 ? (c.close - prevClose) / prevClose * 100 : 0;
                  },
                  fmtVal: v => v.toFixed(2) + '%', fmtShort: v => v.toFixed(1) + '%' },
        amp:    { label: '振幅', baseline: 0, unit: '%',
                  extractor: c => c.open > 0 ? (c.high - c.low) / c.open * 100 : 0,
                  fmtVal: v => v.toFixed(2) + '%', fmtShort: v => v.toFixed(1) + '%' },
        mktcap: { label: '市值', baseline: 0, requiresSupply: true,
                  extractor: (c, i, arr, ctx) => ctx.supply != null ? c.close * ctx.supply / 10000 : null,
                  fmtVal: v => fmtMktcap(v), fmtShort: v => fmtVolShort(v) },
    };

    let volModalState = { id: null, metric: 'vol', unit: 'day', count: 30 };

    function openMetricModal(id, metric) {
        const row = rows.find(r => r.id === id);
        if (!row || !METRIC_DEFS[metric]) return;
        volModalState = { id, metric, unit: 'day', count: 30 };
        document.getElementById('volModalTitle').textContent = `${row.sym} ${METRIC_DEFS[metric].label}趋势`;
        document.getElementById('volUnitSelect').value = 'day';
        document.getElementById('volCountInput').value = 30;
        document.getElementById('volModal').style.display = 'flex';
        resetVolModalSize();
        loadMetricChart();
    }

    function openVolModal(id) { openMetricModal(id, 'vol'); }

    function closeVolModal() {
        document.getElementById('volModal').style.display = 'none';
        volModalState = { id: null, metric: 'vol', unit: 'day', count: 30 };
    }

    // ── 弹窗大小：默认 60% 视口，右下角拖拽调节 ─────────────────────
    function resetVolModalSize() {
        const box = document.getElementById('volModalBox');
        box.style.width  = Math.round(window.innerWidth * 0.6) + 'px';
        box.style.height = Math.round(window.innerHeight * 0.6) + 'px';
    }

    let _volResizeStartX = 0, _volResizeStartY = 0, _volResizeStartW = 0, _volResizeStartH = 0;
    let _volResizeActive = false;

    function startVolModalResize(e) {
        e.preventDefault();
        e.stopPropagation();
        _volResizeActive = true;
        const box = document.getElementById('volModalBox');
        _volResizeStartX = e.clientX;
        _volResizeStartY = e.clientY;
        _volResizeStartW = box.offsetWidth;
        _volResizeStartH = box.offsetHeight;
        document.addEventListener('mousemove', onVolModalResize);
        document.addEventListener('mouseup', stopVolModalResize);
    }

    function onVolModalResize(e) {
        const box = document.getElementById('volModalBox');
        const minW = 360, minH = 260;
        const maxW = window.innerWidth * 0.95, maxH = window.innerHeight * 0.95;
        box.style.width  = Math.max(minW, Math.min(maxW, _volResizeStartW + (e.clientX - _volResizeStartX))) + 'px';
        box.style.height = Math.max(minH, Math.min(maxH, _volResizeStartH + (e.clientY - _volResizeStartY))) + 'px';
    }

    function stopVolModalResize(e) {
        if (e) e.stopPropagation();
        document.removeEventListener('mousemove', onVolModalResize);
        document.removeEventListener('mouseup', stopVolModalResize);
        // 延迟复位，防止本次 mouseup 触发的 overlay click 误关闭弹框
        setTimeout(() => { _volResizeActive = false; }, 0);
    }

    function onVolParamChange() {
        const unit = document.getElementById('volUnitSelect').value;
        const count = Math.max(2, Math.min(1000, parseInt(document.getElementById('volCountInput').value) || 30));
        document.getElementById('volCountInput').value = count;
        volModalState.unit = unit;
        volModalState.count = count;
        loadMetricChart();
    }

    // 市值指标依赖流通量常量（供给量），供给量近似不随时间变化，
    // 所以市值历史 = 收盘价历史 × 供给量，无需单独的市值数据源
    function resolveSupply(sym) {
        return CIRCULATING_SUPPLY[apiSym(sym)] ?? CIRCULATING_SUPPLY[sym] ?? DYNAMIC_SUPPLY[sym] ?? null;
    }

    async function loadMetricChart() {
        const { id, metric, unit, count } = volModalState;
        const row = rows.find(r => r.id === id);
        const body = document.getElementById('volChartBody');
        if (!row) return;
        const metricDef = METRIC_DEFS[metric];
        body.innerHTML = `<div class="detail-tip">加载中...</div>`;

        const src = resolveDetailSource(row);
        if (KLINE_UNSUPPORTED[src]) {
            body.innerHTML = `<div class="detail-tip">${KLINE_UNSUPPORTED[src]}</div>`;
            return;
        }
        const fetcher = KLINE_FETCHERS[src];
        if (!fetcher) {
            body.innerHTML = `<div class="detail-tip">该来源暂不支持${metricDef.label}趋势</div>`;
            return;
        }

        let supply = null;
        if (metricDef.requiresSupply) {
            supply = resolveSupply(row.sym);
            if (supply == null) {
                body.innerHTML = `<div class="detail-tip">该标的未配置流通量，无法计算市值趋势</div>`;
                return;
            }
        }

        const s = apiSym(row.sym);
        const candles = await fetcher(s, unit, count);
        if (volModalState.id !== id || volModalState.metric !== metric || volModalState.unit !== unit || volModalState.count !== count) return; // 期间用户已切换，丢弃过期结果

        if (!candles || !candles.length) {
            body.innerHTML = `<div class="detail-tip">查询失败，请稍后重试</div>`;
            return;
        }

        const unitLabel = rangeUnitLabel(unit);
        const coverageTip = candles.length < count
            ? `<div class="detail-tip">该来源仅返回 ${candles.length} ${unitLabel}数据（请求 ${count} ${unitLabel}）</div>`
            : '';
        body.innerHTML = renderMetricChart(candles, unit, metric, { supply }) + coverageTip;
    }

    function renderMetricChart(candles, unit, metric, ctx = {}) {
        const metricDef = METRIC_DEFS[metric];
        const W = 520, H = 220, padL = 46, padR = 10, padT = 14, padB = 26;
        const innerW = W - padL - padR, innerH = H - padT - padB;

        const values = candles.map((c, i) => metricDef.extractor(c, i, candles, ctx) ?? 0);
        const dataMax = Math.max(...values);
        const dataMin = Math.min(...values);
        const maxVal = metricDef.baseline != null ? Math.max(dataMax, metricDef.baseline) : dataMax;
        const minVal = metricDef.baseline != null ? metricDef.baseline : dataMin;
        const span = (maxVal - minVal) || 1;

        const n = candles.length;
        const stepX = n > 1 ? innerW / (n - 1) : 0;
        const points = values.map((v, i) => {
            const x = padL + (n > 1 ? i * stepX : innerW / 2);
            const y = padT + innerH - (v - minVal) / span * innerH;
            return { x, y, v };
        });

        const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
        const areaPath = `${linePath} L${points[points.length - 1].x.toFixed(1)},${(padT + innerH).toFixed(1)} L${points[0].x.toFixed(1)},${(padT + innerH).toFixed(1)} Z`;

        // 涨跌幅按最新值正负着色，其余指标统一用主题蓝
        const lineColorVar = metric === 'change'
            ? (values[values.length - 1] >= 0 ? 'var(--up-color)' : 'var(--down-color)')
            : 'var(--primary-blue)';

        // Y 轴网格线（4 条）
        const gridLines = [0, 1, 2, 3, 4].map(i => {
            const y = padT + innerH - (i / 4) * innerH;
            const val = minVal + (i / 4) * span;
            return `<line class="vol-chart-grid" x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}"></line>` +
                   `<text class="vol-chart-axis-text" x="${(padL - 6).toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="end">${metricDef.fmtShort(val)}</text>`;
        }).join('');

        // X 轴标签：首、中、末三个时间点
        const labelIdx = n > 1 ? [0, Math.floor((n - 1) / 2), n - 1] : [0];
        const xLabels = [...new Set(labelIdx)].map(i => {
            const p = points[i];
            return `<text class="vol-chart-axis-text" x="${p.x.toFixed(1)}" y="${(H - 6).toFixed(1)}" text-anchor="middle">${fmtDateForUnit(candles[i].ts, unit)}</text>`;
        }).join('');

        const dots = points.map((p, i) =>
            `<circle class="vol-chart-dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" ` +
            `onmousemove="showVolTooltip(event,${i})" onmouseleave="hideVolTooltip()"></circle>`
        ).join('');

        window._volChartPoints = candles.map((c, i) => ({ ts: c.ts, v: values[i] }));
        window._volChartMetric = metric;

        const latest = values[values.length - 1];
        const avg = values.reduce((a, b) => a + b, 0) / n;

        return `<div class="vol-chart-wrap">` +
            `<svg class="vol-chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">` +
            gridLines + `<path class="vol-chart-area" d="${areaPath}" style="fill:${lineColorVar};opacity:0.08"></path>` +
            `<path class="vol-chart-line" d="${linePath}" style="stroke:${lineColorVar}"></path>` + dots + xLabels +
            `</svg>` +
            `<div class="vol-chart-tooltip" id="volTooltip"></div>` +
            `</div>` +
            `<div class="vol-chart-summary">` +
            `<span>最新: <b>${metricDef.fmtVal(latest)}</b></span>` +
            `<span>均值: <b>${metricDef.fmtVal(avg)}</b></span>` +
            `<span>最高: <b>${metricDef.fmtVal(maxVal)}</b></span>` +
            `</div>`;
    }

    function fmtVolShort(v) {
        if (v >= 10000) return (v / 10000).toFixed(1) + '亿';
        return v.toFixed(0) + '万';
    }

    function fmtDateForUnit(ts, unit) {
        const d = new Date(ts);
        if (unit === 'month') return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function showVolTooltip(e, i) {
        const pt = window._volChartPoints?.[i];
        if (!pt) return;
        const tooltip = document.getElementById('volTooltip');
        if (!tooltip) return;
        const metricDef = METRIC_DEFS[window._volChartMetric] || METRIC_DEFS.vol;
        // position:fixed，直接用视口坐标定位，避免被 overflow:auto 的图表容器裁剪
        const dateStr = new Date(pt.ts).toLocaleDateString();
        tooltip.textContent = `${dateStr}  ${metricDef.label}: ${metricDef.fmtVal(pt.v)}`;
        tooltip.style.left = e.clientX + 'px';
        tooltip.style.top = (e.clientY - 8) + 'px';
        tooltip.style.display = 'block';
    }

    function hideVolTooltip() {
        const tooltip = document.getElementById('volTooltip');
        if (tooltip) tooltip.style.display = 'none';
    }

    // ── 笔记功能（按标的 symbol 存储，增删改查 + GitHub Gist 同步） ──
    const NOTES_STORAGE_KEY = 'uex-notes';
    const GIST_CONFIG_KEY   = 'uex-gist-config';
    const GIST_FILENAME     = 'uex-settings.json';

    function loadAllNotes() {
        try {
            const raw = localStorage.getItem(NOTES_STORAGE_KEY);
            return raw ? JSON.parse(raw) : {};
        } catch { return {}; }
    }

    function saveAllNotes(all) {
        localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(all));
    }

    function getNotes(sym) {
        const all = loadAllNotes();
        return all[sym] || [];
    }


    function addNote(sym, text) {
        if (!text || !text.trim()) return;
        const all = loadAllNotes();
        if (!all[sym]) all[sym] = [];
        all[sym].push({ id: 'n' + Date.now() + Math.random().toString(36).slice(2, 6), text: text.trim(), ts: Date.now() });
        saveAllNotes(all);
    }

    function updateNote(sym, noteId, text) {
        const all = loadAllNotes();
        const list = all[sym] || [];
        const n = list.find(x => x.id === noteId);
        if (!n) return;
        n.text = text.trim();
        n.ts = Date.now();
        saveAllNotes(all);
    }

    function deleteNote(sym, noteId) {
        const all = loadAllNotes();
        if (!all[sym]) return;
        all[sym] = all[sym].filter(x => x.id !== noteId);
        if (!all[sym].length) delete all[sym];
        saveAllNotes(all);
    }

    let notesModalSym = null;
    let _editingNoteId = null;

    function openNotesModal(sym) {
        notesModalSym = sym;
        _editingNoteId = null;
        document.getElementById('notesModalTitle').textContent = `${sym} 笔记`;
        document.getElementById('noteInput').value = '';
        document.getElementById('notesModal').style.display = 'flex';
        renderNotesList();
    }

    function closeNotesModal() {
        document.getElementById('notesModal').style.display = 'none';
        notesModalSym = null;
        renderTable(); // 刷新笔记徽标
    }

    function renderNotesList() {
        const body = document.getElementById('notesListBody');
        const notes = getNotes(notesModalSym).slice().sort((a, b) => b.ts - a.ts);
        if (!notes.length) {
            body.innerHTML = `<div class="note-empty-tip">暂无笔记，在下方输入并保存</div>`;
            return;
        }
        body.innerHTML = notes.map(n => {
            const timeStr = new Date(n.ts).toLocaleString();
            if (_editingNoteId === n.id) {
                return `<div class="note-item">` +
                    `<div class="note-item-head"><span class="note-item-time">${timeStr}</span></div>` +
                    `<div class="note-item-body">` +
                    `<textarea id="noteEditInput_${n.id}" rows="3">${escapeHtml(n.text)}</textarea>` +
                    `<div class="note-item-actions" style="margin-top:6px">` +
                    `<span onclick="saveEditedNote('${n.id}')">✔ 保存</span>` +
                    `<span onclick="cancelEditNote()">取消</span>` +
                    `</div></div></div>`;
            }
            return `<div class="note-item">` +
                `<div class="note-item-head">` +
                `<span class="note-item-time">${timeStr}</span>` +
                `<div class="note-item-actions">` +
                `<span onclick="startEditNote('${n.id}')">编辑</span>` +
                `<span class="danger" onclick="removeNote('${n.id}')">删除</span>` +
                `</div></div>` +
                `<div class="note-item-body">${escapeHtml(n.text)}</div>` +
                `</div>`;
        }).join('');
    }

    function escapeHtml(s) {
        return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function submitNoteInput() {
        const input = document.getElementById('noteInput');
        const text = input.value;
        if (!text.trim()) return;
        addNote(notesModalSym, text);
        input.value = '';
        renderNotesList();
        autoSyncSettingsToGist();
    }

    function startEditNote(noteId) {
        _editingNoteId = noteId;
        renderNotesList();
    }

    function cancelEditNote() {
        _editingNoteId = null;
        renderNotesList();
    }

    function saveEditedNote(noteId) {
        const ta = document.getElementById(`noteEditInput_${noteId}`);
        if (!ta) return;
        updateNote(notesModalSym, noteId, ta.value);
        _editingNoteId = null;
        renderNotesList();
        autoSyncSettingsToGist();
    }

    function removeNote(noteId) {
        deleteNote(notesModalSym, noteId);
        renderNotesList();
        autoSyncSettingsToGist();
    }

    // ── 顶部快捷链接（名称 + URL，可全局同步） ─────────────────────
    const QUICK_LINKS_KEY = 'uex-quick-links';

    function loadQuickLinks() {
        try {
            const raw = localStorage.getItem(QUICK_LINKS_KEY);
            return raw ? JSON.parse(raw) : [];
        } catch { return []; }
    }

    function saveQuickLinks(list) {
        localStorage.setItem(QUICK_LINKS_KEY, JSON.stringify(list));
    }

    function renderQuickLinksBar() {
        const bar = document.getElementById('quickLinksBar');
        const links = loadQuickLinks();
        bar.innerHTML = links.length
            ? links.map((l, i) =>
                `<a class="quick-link-chip" href="${escapeHtml(l.url)}" target="_blank" rel="noopener" ` +
                `oncontextmenu="openQuickLinkCtxMenu(event, ${i})" title="右键可编辑/排序/删除">${escapeHtml(l.name)}</a>`
              ).join('')
            : '';
    }

    // ── 快捷链接右键菜单（编辑 / 删除 / 上移 / 下移） ─────────────
    function openQuickLinkCtxMenu(e, i) {
        e.preventDefault();
        e.stopPropagation();
        closeQuickLinkCtxMenu();
        const menu = document.getElementById('quickLinkCtxMenu');
        const links = loadQuickLinks();
        const l = links[i];
        if (!l) return;
        menu.innerHTML =
            `<div class="ctx-item" onclick="openQuickLinkEditModal(${i});closeQuickLinkCtxMenu()">✏️ 编辑</div>` +
            (i > 0 ? `<div class="ctx-item" onclick="moveQuickLink(${i}, -1);closeQuickLinkCtxMenu()">⬆️ 上移</div>` : '') +
            (i < links.length - 1 ? `<div class="ctx-item" onclick="moveQuickLink(${i}, 1);closeQuickLinkCtxMenu()">⬇️ 下移</div>` : '') +
            `<div class="ctx-item danger" onclick="removeQuickLink(${i});closeQuickLinkCtxMenu()">🗑️ 删除</div>`;
        menu.style.display = 'block';
        const menuW = menu.offsetWidth, menuH = menu.offsetHeight;
        const x = Math.min(e.clientX, window.innerWidth - menuW - 8);
        const y = Math.min(e.clientY, window.innerHeight - menuH - 8);
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
    }

    function closeQuickLinkCtxMenu() {
        document.getElementById('quickLinkCtxMenu').style.display = 'none';
    }

    function moveQuickLink(index, delta) {
        const links = loadQuickLinks();
        const target = index + delta;
        if (target < 0 || target >= links.length) return;
        const [item] = links.splice(index, 1);
        links.splice(target, 0, item);
        saveQuickLinks(links);
        renderQuickLinksBar();
        if (document.getElementById('quickLinkEditModal').style.display === 'flex') renderQuickLinkEditList();
        autoSyncSettingsToGist();
    }

    let editingQuickLinkIndex = -1;

    function openQuickLinkEditModal(index) {
        editingQuickLinkIndex = (typeof index === 'number' && index >= 0) ? index : -1;
        const links = loadQuickLinks();
        const editing = editingQuickLinkIndex >= 0 ? links[editingQuickLinkIndex] : null;
        document.getElementById('quickLinkNameInput').value = editing ? editing.name : '';
        document.getElementById('quickLinkUrlInput').value = editing ? editing.url : '';
        document.getElementById('quickLinkSubmitBtn').textContent = editing ? '保存修改' : '添加';
        document.getElementById('quickLinkCancelBtn').style.display = editing ? 'inline-block' : 'none';
        renderQuickLinkEditList();
        document.getElementById('quickLinkEditModal').style.display = 'flex';
    }

    function cancelQuickLinkEdit() {
        editingQuickLinkIndex = -1;
        document.getElementById('quickLinkNameInput').value = '';
        document.getElementById('quickLinkUrlInput').value = '';
        document.getElementById('quickLinkSubmitBtn').textContent = '添加';
        document.getElementById('quickLinkCancelBtn').style.display = 'none';
        renderQuickLinkEditList();
    }

    function closeQuickLinkEditModal() {
        document.getElementById('quickLinkEditModal').style.display = 'none';
        cancelQuickLinkEdit();
    }

    function renderQuickLinkEditList() {
        const body = document.getElementById('quickLinkEditListBody');
        const links = loadQuickLinks();
        body.innerHTML = links.length
            ? links.map((l, i) =>
                `<div class="quick-link-edit-item">` +
                `<span class="qle-order" title="上移/下移" style="cursor:pointer;user-select:none" onclick="moveQuickLink(${i}, -1)">⬆️</span>` +
                `<span class="qle-order" title="上移/下移" style="cursor:pointer;user-select:none" onclick="moveQuickLink(${i}, 1)">⬇️</span>` +
                `<span class="qle-name" style="cursor:pointer" title="点击编辑" onclick="openQuickLinkEditModal(${i})">${escapeHtml(l.name)}</span>` +
                `<span class="qle-url">${escapeHtml(l.url)}</span>` +
                `<span class="qle-del" style="cursor:pointer" title="编辑" onclick="openQuickLinkEditModal(${i})">✏️</span>` +
                `<span class="qle-del" style="cursor:pointer" title="删除" onclick="removeQuickLink(${i})">✕ 删除</span>` +
                `</div>`
              ).join('')
            : `<div class="note-empty-tip">暂无快捷链接</div>`;
    }

    function submitQuickLink() {
        const nameInput = document.getElementById('quickLinkNameInput');
        const urlInput = document.getElementById('quickLinkUrlInput');
        const name = nameInput.value.trim();
        let url = urlInput.value.trim();
        if (!name || !url) return;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        const links = loadQuickLinks();
        if (editingQuickLinkIndex >= 0 && links[editingQuickLinkIndex]) {
            links[editingQuickLinkIndex] = { name, url };
        } else {
            links.push({ name, url });
        }
        saveQuickLinks(links);
        nameInput.value = '';
        urlInput.value = '';
        editingQuickLinkIndex = -1;
        document.getElementById('quickLinkSubmitBtn').textContent = '添加';
        document.getElementById('quickLinkCancelBtn').style.display = 'none';
        renderQuickLinkEditList();
        renderQuickLinksBar();
        autoSyncSettingsToGist();
    }

    function removeQuickLink(index) {
        const links = loadQuickLinks();
        links.splice(index, 1);
        saveQuickLinks(links);
        renderQuickLinkEditList();
        renderQuickLinksBar();
        autoSyncSettingsToGist();
    }

    // ── GitHub Gist 全局同步（币种列表 / 笔记 / 主题 / 列显示 / 快捷链接） ──
    function loadGistConfig() {
        try {
            const raw = localStorage.getItem(GIST_CONFIG_KEY);
            return raw ? JSON.parse(raw) : { token: '', gistId: '' };
        } catch { return { token: '', gistId: '' }; }
    }

    function saveGistConfigObj(cfg) {
        localStorage.setItem(GIST_CONFIG_KEY, JSON.stringify(cfg));
    }

    function openGlobalSyncModal() {
        const cfg = loadGistConfig();
        document.getElementById('gistTokenInput').value = cfg.token || '';
        document.getElementById('gistIdInput').value = cfg.gistId || '';
        document.getElementById('gistConfigTip').textContent = '';
        document.getElementById('gistConfigModal').style.display = 'flex';
        renderGistSyncStatus();
    }

    function closeGistConfigModal() {
        document.getElementById('gistConfigModal').style.display = 'none';
    }

    function renderGistSyncStatus() {
        const cfg = loadGistConfig();
        const el = document.getElementById('gistConfigStatus');
        if (!el) return;
        el.textContent = cfg.token ? (cfg.gistId ? `已配置，Gist ID: ${cfg.gistId}` : '已配置 Token，尚未创建 Gist') : '未配置同步';
        el.className = 'notes-sync-status' + (cfg.token ? ' ok' : '');
    }

    function saveGistConfig() {
        const token = document.getElementById('gistTokenInput').value.trim();
        const gistId = document.getElementById('gistIdInput').value.trim();
        saveGistConfigObj({ token, gistId });
        document.getElementById('gistConfigTip').textContent = '配置已保存';
        renderGistSyncStatus();
    }

    function gistHeaders(token) {
        return { Authorization: `token ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' };
    }

    // ── 全量设置的序列化 / 应用 ─────────────────────────────────────
    function serializeSettings() {
        return {
            rows: rows.map(r => ({ sym: r.sym, exchange: r.exchange, pinned: !!r.pinned })),
            visibleCols,
            customCols: CUSTOM_COLS,
            theme: localStorage.getItem('uex-theme') || 'light',
            notes: loadAllNotes(),
            quickLinks: loadQuickLinks(),
        };
    }

    function applySettings(settings) {
        if (!settings) return;
        if (Array.isArray(settings.rows)) {
            rows = settings.rows.map(r => ({ id: r.sym + '@' + (r.exchange || 'auto') + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), sym: r.sym, exchange: r.exchange || '', pinned: !!r.pinned }));
        }
        if (Array.isArray(settings.visibleCols)) visibleCols = settings.visibleCols;
        if (Array.isArray(settings.customCols)) {
            CUSTOM_COLS = settings.customCols;
            customColSeq = CUSTOM_COLS.reduce((max, c) => {
                const n = parseInt((c.key || '').replace('custom_', ''), 10);
                return isNaN(n) ? max : Math.max(max, n + 1);
            }, 1);
        }
        if (settings.theme) { applyTheme(settings.theme); localStorage.setItem('uex-theme', settings.theme); }
        if (settings.notes) saveAllNotes(settings.notes);
        if (Array.isArray(settings.quickLinks)) saveQuickLinks(settings.quickLinks);

        renderHeader();
        renderTable();
        renderQuickLinksBar();
        cache && Object.keys(cache).forEach(k => delete cache[k]);
        fetchAll();
    }

    async function pushSettingsToGist(showTip) {
        const cfg = loadGistConfig();
        const tip = document.getElementById('gistConfigTip');
        if (!cfg.token) { if (showTip) tip.textContent = '请先填写 Token'; return; }
        const content = JSON.stringify(serializeSettings(), null, 2);
        try {
            if (cfg.gistId) {
                const resp = await fetch(`https://api.github.com/gists/${cfg.gistId}`, {
                    method: 'PATCH',
                    headers: gistHeaders(cfg.token),
                    body: JSON.stringify({ files: { [GIST_FILENAME]: { content } } }),
                });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                if (showTip) tip.textContent = '上传成功';
            } else {
                const resp = await fetch(`https://api.github.com/gists`, {
                    method: 'POST',
                    headers: gistHeaders(cfg.token),
                    body: JSON.stringify({ description: 'UEX 全局设置同步', public: false, files: { [GIST_FILENAME]: { content } } }),
                });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const json = await resp.json();
                cfg.gistId = json.id;
                saveGistConfigObj(cfg);
                document.getElementById('gistIdInput').value = cfg.gistId;
                if (showTip) tip.textContent = '已创建新 Gist 并上传成功';
            }
            renderGistSyncStatus();
        } catch (e) {
            if (showTip) tip.textContent = '上传失败: ' + e.message;
        }
    }

    async function pullSettingsFromGist(showTip) {
        const cfg = loadGistConfig();
        const tip = document.getElementById('gistConfigTip');
        if (!cfg.token) { if (showTip) tip.textContent = '请先填写 Token'; return; }
        if (!cfg.gistId) { if (showTip) tip.textContent = '暂无 Gist ID，请先上传一次'; return; }
        try {
            const resp = await fetch(`https://api.github.com/gists/${cfg.gistId}`, { headers: gistHeaders(cfg.token) });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const json = await resp.json();
            const file = json.files?.[GIST_FILENAME];
            if (!file) throw new Error('Gist 中未找到设置文件');
            const remoteSettings = JSON.parse(file.content);
            applySettings(remoteSettings);
            if (showTip) tip.textContent = '拉取成功';
            if (notesModalSym) renderNotesList();
        } catch (e) {
            if (showTip) tip.textContent = '拉取失败: ' + e.message;
        }
    }

    function autoSyncSettingsToGist() {
        const cfg = loadGistConfig();
        if (cfg.token) pushSettingsToGist(false);
    }

    // ── 列删除 ───────────────────────────────────────────────────
    function removeCol(key) {
        visibleCols = visibleCols.filter(k => k !== key);
        if (key.startsWith('custom_')) {
            CUSTOM_COLS = CUSTOM_COLS.filter(c => c.key !== key);
            renderColPanel();
        }
        renderHeader();
        renderTable();
    }

    // ── 列可见性控制面板 ─────────────────────────────────────────
    const CUSTOM_HEADER_COLORS = ['#fff3cd', '#e8f0ff', '#e8f9ee']; // 黄/蓝/绿三个预设

    function renderColPanel() {
        const panel = document.getElementById('colPanel');
        const checkboxRows = ALL_COLS.filter(c => c.key !== 'symbol').map(c => {
            const copyBtn = c.key === 'price'
                ? `<button class="sort-btn" style="padding:1px 6px;font-size:10px;margin-left:6px" onclick="addCustomPriceCol();event.stopPropagation()">复制</button>`
                : '';
            return `<label><input type="checkbox" ${visibleCols.includes(c.key) ? 'checked' : ''} onchange="toggleColVisible('${c.key}')"> ${c.label}${copyBtn}</label>`;
        }).join('');

        const customRows = CUSTOM_COLS.length
            ? `<div class="col-panel-divider"></div>` + CUSTOM_COLS.map(col => {
                const swatches = CUSTOM_HEADER_COLORS.map(color =>
                    `<span class="color-swatch" style="background:${color}" title="设为此背景色" onclick="setCustomHeaderColor('${col.key}','${color}')"></span>`
                ).join('') + `<span class="color-swatch reset" title="重置为默认" onclick="setCustomHeaderColor('${col.key}','')"></span>`;
                return `<div class="custom-col-row">` +
                    `<span style="flex:1;overflow:hidden;text-overflow:ellipsis" title="${col.label}">${col.label}</span>` +
                    `<input type="number" step="0.01" value="${col.coef}" onchange="updateCustomCoef('${col.key}', this.value)">` +
                    swatches +
                    `<span class="col-del" title="删除此列" onclick="removeCustomCol('${col.key}')">✕</span>` +
                    `</div>`;
            }).join('')
            : '';

        panel.innerHTML = checkboxRows + customRows;
    }

    function toggleColVisible(key) {
        if (visibleCols.includes(key)) {
            visibleCols = visibleCols.filter(k => k !== key);
        } else {
            const insertAt = ALL_COLS.filter(c => visibleCols.includes(c.key) || c.key === key).findIndex(c => c.key === key);
            visibleCols.splice(insertAt, 0, key);
        }
        renderHeader();
        renderTable();
        autoSyncSettingsToGist();
    }

    function addCustomPriceCol() {
        const col = createCustomPriceCol(0.8);
        const priceIdx = visibleCols.indexOf('price');
        visibleCols.splice(priceIdx + 1, 0, col.key);
        renderColPanel();
        renderHeader();
        renderTable();
        autoSyncSettingsToGist();
    }

    function updateCustomCoef(key, val) {
        const col = CUSTOM_COLS.find(c => c.key === key);
        const coef = parseFloat(val);
        if (!col || isNaN(coef)) return;
        col.coef = coef;
        col.label = `价格×${coef}`;
        renderColPanel();
        renderHeader();
        renderTable();
        autoSyncSettingsToGist();
    }

    function setCustomHeaderColor(key, color) {
        const col = CUSTOM_COLS.find(c => c.key === key);
        if (!col) return;
        col.headerColor = color;
        renderColPanel();
        renderHeader();
    }

    function removeCustomCol(key) {
        CUSTOM_COLS = CUSTOM_COLS.filter(c => c.key !== key);
        visibleCols = visibleCols.filter(k => k !== key);
        renderColPanel();
        renderHeader();
        renderTable();
        autoSyncSettingsToGist();
    }

    function toggleColPanel(e) {
        if (e) e.stopPropagation();
        const panel = document.getElementById('colPanel');
        const willShow = panel.style.display === 'none';
        if (willShow) renderColPanel();
        panel.style.display = willShow ? 'block' : 'none';
    }

    document.addEventListener('click', (e) => {
        const wrap = document.querySelector('.col-toggle-wrap');
        const panel = document.getElementById('colPanel');
        if (panel && panel.style.display !== 'none' && wrap && !wrap.contains(e.target)) {
            panel.style.display = 'none';
        }
    });

    // ── 列宽拖拽 ─────────────────────────────────────────────────
    let _resizeKey = null, _resizeStartX = 0, _resizeStartW = 0;

    function startResize(e, key) {
        e.preventDefault();
        _resizeKey = key;
        _resizeStartX = e.clientX;
        _resizeStartW = getCol(key).width;
        e.target.classList.add('dragging');
        document.addEventListener('mousemove', onResize);
        document.addEventListener('mouseup', stopResize);
    }

    function onResize(e) {
        if (!_resizeKey) return;
        const col = getCol(_resizeKey);
        col.width = Math.max(60, _resizeStartW + (e.clientX - _resizeStartX));
        const idx = visibleCols.indexOf(_resizeKey);
        const ths = document.querySelectorAll('#theadRow th');
        if (ths[idx]) ths[idx].style.width = col.width + 'px';
    }

    function stopResize() {
        if (_resizeKey) {
            document.querySelectorAll('.resize-handle').forEach(h => h.classList.remove('dragging'));
            _resizeKey = null;
        }
        document.removeEventListener('mousemove', onResize);
        document.removeEventListener('mouseup', stopResize);
    }

    // ── 行渲染 ────────────────────────────────────────────────────
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const ordered = sortedRows();
        tbody.innerHTML = ordered.map(row => {
            const { id, sym, exchange, pinned } = row;
            const d = cache[id];
            const src = d ? (d.source || 'spot') : (exchange || '');
            const alphaSymbolResolved = d ? (d.alphaSymbol || '') : '';
            const chartUrl = getChartUrl(sym, src, alphaSymbolResolved);
            const detailBtn = `<button class="sort-btn" style="padding:2px 8px;font-size:11px;flex-shrink:0" onclick="openDetail('${id}')">详情</button>`;
            const ctxAttr = `oncontextmenu="openRowCtxMenu(event,'${id}')"`;
            const pinBadge = pinned ? `<span class="pin-badge" title="已置顶">📌</span>` : '';
            const noteBadge = getNotes(sym).length ? `<span class="note-badge" title="有笔记，点击查看" onclick="event.stopPropagation();openNotesModal('${sym}')">📝</span>` : '';

            // 链上行：单独一行展示链上详情
            if (exchange === 'binance-chain' || src === 'binance-chain') {
                const isLoading = !d;
                const alphaUrl = alphaSymbolResolved
                    ? `https://www.binance.com/zh-CN/alpha`
                    : `https://www.binance.com/zh-CN/alpha`;

                if (isLoading) {
                    return `<tr class="chain-row${pinned ? ' pinned' : ''}"><td colspan="${visibleCols.length}">` +
                        `<div class="chain-inline" ${ctxAttr}>` +
                        `${pinBadge}` +
                        `<a class="sym-link" href="${alphaUrl}" target="_blank" rel="noopener">${sym}</a>` +
                        `${noteBadge}` +
                        `<span class="chain-inline-label">链上</span>` +
                        `<span class="chain-inline-loading">查询中...</span>` +
                        `${detailBtn}` +
                        `</div></td></tr>`;
                }

                const changeClass = d.change > 0 ? 'up' : d.change < 0 ? 'down' : 'neutral';
                const changeStr = (d.change > 0 ? '+' : '') + d.change.toFixed(2) + '%';
                const extraFields = [];
                if (d.vol > 0)    extraFields.push(`成交额: <b>${fmtVol(d.vol)}$</b>`);
                if (d.high)       extraFields.push(`最高: <b class="high-val">${fmtPrice(d.high)}</b>`);
                if (d.low)        extraFields.push(`最低: <b class="low-val">${fmtPrice(d.low)}</b>`);
                if (d.mktcap)     extraFields.push(`市值: <b>${fmtMktcap(d.mktcap)}$</b>`);
                if (d.liquidity)  extraFields.push(`流动性: <b>$${fmtNum(d.liquidity)}</b>`);
                if (d.alphaSymbol) extraFields.push(`Alpha: <b style="color:var(--chain-label-text)">${d.alphaSymbol}</b>`);

                return `<tr class="chain-row${pinned ? ' pinned' : ''}"><td colspan="${visibleCols.length}">` +
                    `<div class="chain-inline" ${ctxAttr}>` +
                    `${pinBadge}` +
                    `<a class="sym-link" href="${alphaUrl}" target="_blank" rel="noopener">${sym}</a>` +
                    `${noteBadge}` +
                    `<span class="chain-inline-label">链上</span>` +
                    `<span class="price-val" style="font-size:13px">$${fmtPrice(d.price)}</span>` +
                    `<span class="${changeClass}" style="font-size:12px">${changeStr}</span>` +
                    (extraFields.length ? `<span style="color:#aaa;font-size:11px">&nbsp;|&nbsp;</span>` + extraFields.join(`<span style="color:#ddd;margin:0 6px">|</span>`) : '') +
                    `${detailBtn}` +
                    `</div></td></tr>`;
            }

            const ampHighlight = d && d.amp != null && d.amp > 10 ? ' amp-highlight' : '';

            const cells = visibleCols.map(key => {
                const title = fieldTitle(src, key);

                if (key === 'detail') {
                    return `<td title="查看K线详情"><button class="sort-btn" style="padding:2px 8px;font-size:11px" onclick="openDetail('${id}')">详情</button></td>`;
                }

                if (key.startsWith('custom_')) {
                    const col = getCol(key);
                    if (!d || isNaN(parseFloat(d.price))) return `<td class="neutral" title="${col.label}">--</td>`;
                    const val = parseFloat(d.price) * col.coef;
                    return `<td class="price-val" title="${col.label}">${fmtPrice(val.toFixed(decimalsForPrice(val)))}</td>`;
                }

                if (!d) {
                    if (key === 'symbol') return `<td title="${title}"><div class="symbol-cell" ${ctxAttr}>${pinBadge}<a class="sym-link" href="${chartUrl}" target="_blank" rel="noopener">${sym}</a>${noteBadge}${exchange ? srcTag(exchange) : ''}</div></td>`;
                    return `<td class="neutral" title="${title}">--</td>`;
                }

                if (key === 'symbol') {
                    return `<td title="${title}"><div class="symbol-cell" ${ctxAttr}>${pinBadge}<a class="sym-link" href="${chartUrl}" target="_blank" rel="noopener">${sym}</a>${noteBadge}${srcTag(src)}</div></td>`;
                }

                if (key === 'price') {
                    let extra = '';
                    if (src === 'futures' && d.markPrice) {
                        const frClass = parseFloat(d.capitalRate) >= 0 ? 'up' : 'down';
                        const frSign  = parseFloat(d.capitalRate) >= 0 ? '+' : '';
                        extra = `<div style="font-size:11px;color:var(--text-mute);margin-top:2px;font-weight:400">` +
                            `资金费 <span class="${frClass}">${frSign}${d.capitalRate}%</span>` +
                            `</div>`;
                    }
                    return `<td class="price-val" title="点击查看价格趋势"><span class="vol-link" onclick="openMetricModal('${id}','price')">${fmtPrice(d.price)}</span>${extra}</td>`;
                }

                if (key === 'change') {
                    const cls = d.change > 0 ? 'up' : d.change < 0 ? 'down' : 'neutral';
                    const str = (d.change > 0 ? '+' : '') + d.change.toFixed(2) + '%';
                    return `<td class="${cls}" title="点击查看涨跌幅趋势"><span class="vol-link" onclick="openMetricModal('${id}','change')">${str}</span></td>`;
                }

                if (key === 'amp') {
                    const ampCls = d.amp > 10 ? ' style="font-weight:700;color:var(--amp-warn-text)"' : '';
                    return `<td${ampCls} title="点击查看振幅趋势"><span class="vol-link" onclick="openMetricModal('${id}','amp')">${d.amp.toFixed(2)}%</span></td>`;
                }

                if (key === 'vol')    return `<td title="点击查看成交额趋势"><span class="vol-link" onclick="openMetricModal('${id}','vol')">${fmtVol(d.vol)}</span></td>`;
                if (key === 'mktcap') return `<td title="点击查看市值趋势"><span class="vol-link" onclick="openMetricModal('${id}','mktcap')">${fmtMktcap(d.mktcap)}</span></td>`;
                if (key === 'high')   return `<td class="high-val" title="${title}">${fmtPrice(d.high)}</td>`;
                if (key === 'low')    return `<td class="low-val" title="${title}">${fmtPrice(d.low)}</td>`;

                return `<td title="${title}">--</td>`;
            });

            const rowClass = `${ampHighlight}${pinned ? ' pinned' : ''}`.trim();
            return `<tr class="${rowClass}">${cells.join('')}</tr>`;
        }).join('');
    }

    // ── Fetch（支持指定交易所） ───────────────────────────────────
    async function fetchAll() {
        await Promise.all(rows.map(row => fetchRow(row)));

    const BITGET_SPOT_TTL = 2500;
    let bitgetSpotAllCache = null;
    let bitgetSpotAllCacheTime = 0;
    let bitgetSpotAllPromise = null;

    async function getBitgetSpotAll() {
        const now = Date.now();
        if (bitgetSpotAllCache && now - bitgetSpotAllCacheTime < BITGET_SPOT_TTL) {
            return bitgetSpotAllCache;
        }
        if (bitgetSpotAllPromise) return bitgetSpotAllPromise;

        bitgetSpotAllPromise = (async () => {
            try {
                const resp = await fetch(`https://api.bitget.com/api/v2/spot/market/tickers`);
                const json = await resp.json();
                if (json.code === '00000' && Array.isArray(json.data)) {
                    const map = new Map();
                    json.data.forEach(d => map.set(d.symbol, d));
                    bitgetSpotAllCache = map;
                    bitgetSpotAllCacheTime = Date.now();
                }
            } catch {}
            return bitgetSpotAllCache || new Map();
        })();

        const result = await bitgetSpotAllPromise;
        bitgetSpotAllPromise = null;
        return result;
    }

    // 统一返回按时间升序排列的 [{ ts, open, high, low, close }, ...]，失败返回 null
    function computeRangeStats(candles) {
        if (!candles || !candles.length) return null;
        const high = Math.max(...candles.map(c => c.high));
        const low  = Math.min(...candles.map(c => c.low));
        const openBase = candles[0].open;
        const amp = openBase > 0 ? (high - low) / openBase * 100 : 0;
        return { high, low, amp, count: candles.length };
    }

    // ── 币安链上 Alpha Trade ───────────────────────────────────────
    // 流程：先拉取全量 token list（带缓存，避免每个标的各发一次全量请求），
    // 按 symbol 匹配到对应 token（含 alphaId + 完整行情字段），无需额外调用 ticker 接口
    const ALPHA_TOKEN_LIST_TTL = 30000; // 列表体量大，30s 缓存足够新鲜同时避免频繁全量请求
    let alphaTokenListCache = null;
    let alphaTokenListCacheTime = 0;
    let alphaTokenListPromise = null;

    async function getAlphaTokenList() {
        const now = Date.now();
        if (alphaTokenListCache && now - alphaTokenListCacheTime < ALPHA_TOKEN_LIST_TTL) {
            return alphaTokenListCache;
        }
        if (alphaTokenListPromise) return alphaTokenListPromise;

        alphaTokenListPromise = (async () => {
            try {
                const resp = await fetch(
                    `https://www.binance.com/bapi/defi/v1/public/wallet-direct/buw/wallet/cex/alpha/all/token/list`,
                    { headers: { Accept: 'application/json' } }
                );
                if (!resp.ok) {
                    console.error('[Alpha] token/list HTTP错误', resp.status, resp.statusText);
                    return alphaTokenListCache || new Map();
                }
                const json = await resp.json();
                if (json.code && json.code !== '000000') {
                    console.error('[Alpha] token/list 业务错误', json.code, json.message, json.messageDetail);
                }
                if (Array.isArray(json.data)) {
                    const map = new Map();
                    json.data.forEach(t => {
                        if (t.symbol) map.set(t.symbol.toUpperCase(), t);
                    });
                    alphaTokenListCache = map;
                    alphaTokenListCacheTime = Date.now();
                    console.log(`[Alpha] token/list 拉取成功，共 ${map.size} 个代币`);
                } else {
                    console.error('[Alpha] token/list 响应格式异常，data 不是数组:', json);
                }
            } catch (e) {
                console.error('[Alpha] token/list 请求异常（可能是 CORS 或网络问题）:', e);
            }
            return alphaTokenListCache || new Map();
        })();

        const result = await alphaTokenListPromise;
        alphaTokenListPromise = null;
        return result;
    }
