<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEX</title>
    <style>
        :root {
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --primary-blue: #0066ff;
            --up-color: #02ad8f;
            --down-color: #f84960;
            --border-color: #e1e4e8;
            --text-main: #333;
            --text-sub: #888;
            --text-mute: #999;
            --panel-bg: #f8f9fa;
            --hover-bg: #fafbfc;
            --th-bg: #fdfdfd;

            --amp-bg: #fff8e1;
            --amp-bg-hover: #fff3cd;
            --amp-text: #7a5b00;
            --pinned-bg: #eef6ff;
            --pinned-bg-hover: #e2effe;
            --chain-bg: #f8f0ff;
            --chain-bg-hover: #f3e8ff;
            --chain-border: #d8b4fe;
            --chain-label-bg: #ede9fe;
            --chain-label-text: #7c3aed;
            --chain-label-border: #c4b5fd;
            --amp-warn-text: #b35c00;
            --placeholder-text: #999;
        }

        html[data-theme="dark"] {
            --bg-color: #14161a;
            --card-bg: #1c1f26;
            --primary-blue: #4d94ff;
            --up-color: #2dd4a8;
            --down-color: #ff6b7a;
            --border-color: #333844;
            --text-main: #e4e6eb;
            --text-sub: #a0a5ad;
            --text-mute: #767b85;
            --panel-bg: #22252c;
            --hover-bg: #262a32;
            --th-bg: #1f2229;

            --amp-bg: #3d3418;
            --amp-bg-hover: #4a4020;
            --amp-text: #ffd873;
            --pinned-bg: #1c2b40;
            --pinned-bg-hover: #23374f;
            --chain-bg: #2a2140;
            --chain-bg-hover: #34294f;
            --chain-border: #5b4a8a;
            --chain-label-bg: #3a2f5c;
            --chain-label-text: #c4a8ff;
            --chain-label-border: #5b4a8a;
            --amp-warn-text: #ffb454;
            --placeholder-text: #9099a6;
        }

        * { box-sizing: border-box; }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
        }

        .container {
            background: var(--card-bg);
            padding: 16px 20px;
            min-height: 100vh;
            width: 100%;
        }

        h2 { text-align: center; color: var(--text-main); margin: 0; font-size: 18px; }

        .top-bar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .top-bar-links {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }
        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: flex-end;
        }
        .quick-link-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            font-size: 12px;
            color: var(--text-main);
            text-decoration: none;
            background: var(--panel-bg);
            white-space: nowrap;
        }
        .quick-link-chip:hover { background: var(--hover-bg); border-color: var(--primary-blue); color: var(--primary-blue); }
        .quick-links-empty-tip { font-size: 12px; color: var(--text-mute); font-style: italic; }

        .toolbar {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
            padding: 10px 14px;
            background: var(--panel-bg);
            border-radius: 8px;
        }

        .toolbar label { font-weight: 600; white-space: nowrap; font-size: 13px; color: var(--text-main); }

        input[type="text"] {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            font-weight: 600;
            text-transform: uppercase;
            width: 120px;
            font-size: 13px;
            background: var(--card-bg);
            color: var(--text-main);
        }

        .sort-btn {
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            background: var(--card-bg);
            color: var(--text-sub);
            white-space: nowrap;
            user-select: none;
            transition: background 0.15s, color 0.15s;
        }

        .sort-btn.active {
            background: var(--primary-blue);
            color: #fff;
            border-color: var(--primary-blue);
        }

        /* 主表格 */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }

        th {
            background: var(--th-bg);
            color: var(--text-sub);
            font-weight: 500;
            text-align: right;
            padding: 9px 10px;
            border-bottom: 2px solid var(--border-color);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            font-size: 12px;
        }

        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { background: var(--hover-bg); color: var(--text-main); }
        th.col-active { color: var(--primary-blue); }

        th .th-inner { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
        th:first-child .th-inner { justify-content: flex-start; }

        /* 列宽拖拽手柄 */
        th .resize-handle {
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 5px;
            cursor: col-resize;
            user-select: none;
            z-index: 1;
        }
        th .resize-handle:hover, th .resize-handle.dragging { background: var(--primary-blue); opacity: 0.4; }

        th.col-drag-over { border-left: 2px solid var(--primary-blue); }
        th[draggable="true"] { cursor: grab; }
        th[draggable="true"]:active { cursor: grabbing; }

        th .col-del {
            display: none;
            position: absolute;
            top: 3px; right: 7px;
            font-size: 10px;
            color: #bbb;
            cursor: pointer;
            line-height: 1;
            padding: 1px 2px;
        }
        th:hover .col-del { display: block; }
        th .col-del:hover { color: var(--down-color); }

        th:first-child { text-align: left; }

        td {
            padding: 11px 10px;
            border-bottom: 1px solid var(--border-color);
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 13px;
        }

        td:first-child { text-align: left; }

        .symbol-cell {
            font-weight: 600;
            color: var(--text-main);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        /* 标的名称可点击跳转 */
        .sym-link {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
        }
        .sym-link:hover { text-decoration: underline; }

        /* 可点击查看趋势图（成交额/价格/涨跌幅/振幅/市值），暗色下用主题文字色保证可读 */
        .vol-link {
            color: var(--text-main);
            text-decoration: underline;
            text-decoration-color: var(--border-color);
            cursor: pointer;
        }
        .vol-link:hover { color: var(--primary-blue); text-decoration-color: var(--primary-blue); }

        .price-val { font-size: 14px; font-weight: bold; color: var(--primary-blue); }
        .up   { color: var(--up-color);   font-weight: 600; }
        .down { color: var(--down-color); font-weight: 600; }
        .neutral { color: var(--placeholder-text); }

        .high-val { color: var(--up-color); }
        .low-val  { color: var(--down-color); }

        tr.amp-highlight td { background: var(--amp-bg) !important; }
        tr.amp-highlight:hover td { background: var(--amp-bg-hover) !important; }

        tr.pinned td { background: var(--pinned-bg) !important; }
        tr.pinned:hover td { background: var(--pinned-bg-hover) !important; }

        .pin-badge { font-size: 11px; }
        .note-badge { font-size: 11px; cursor: pointer; }
        .note-badge:hover { opacity: 0.7; }

        .refresh-tag {
            text-align: center;
            font-size: 12px;
            color: var(--text-mute);
            margin-top: 12px;
        }

        tr:hover td { background: var(--hover-bg); }

        /* ── 链上子行（嵌入主表格中） ── */
        tr.chain-row td {
            background: var(--chain-bg) !important;
            font-size: 12px;
            padding: 8px 10px;
            border-bottom: 1px dashed var(--chain-border);
        }
        tr.chain-row:hover td { background: var(--chain-bg-hover) !important; }

        .chain-inline {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chain-inline-label {
            display: inline-block;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 3px;
            background: var(--chain-label-bg);
            color: var(--chain-label-text);
            border: 1px solid var(--chain-label-border);
            font-weight: 600;
        }

        .chain-inline-loading { color: var(--text-mute); font-style: italic; font-size: 12px; }

        #mainPanel { display: block; }

        /* ── K线详情 Modal ── */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-box {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 18px 20px;
            width: 340px;
            max-width: 90vw;
            max-height: 90vh;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .modal-close { cursor: pointer; color: var(--text-mute); font-size: 14px; padding: 2px 4px; }
        .modal-close:hover { color: var(--down-color); }

        .modal-range-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
        }

        .modal-range-group input[type="number"] {
            width: 64px;
            padding: 5px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 12px;
            text-transform: none;
        }

        .modal-range-group select {
            padding: 5px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 12px;
            background: var(--card-bg);
            color: var(--text-main);
        }

        #detailBody { font-size: 13px; color: var(--text-main); line-height: 1.8; }
        #detailBody .detail-row { display: flex; justify-content: space-between; padding: 3px 0; }
        #detailBody .detail-label { color: var(--text-sub); }
        #detailBody .detail-tip { color: var(--text-mute); font-size: 12px; font-style: italic; }

        /* ── 成交额趋势图 ── */
        .vol-chart-svg { display: block; width: 100%; height: 220px; overflow: visible; }
        .vol-chart-line { fill: none; stroke: var(--primary-blue); stroke-width: 1.8; }
        .vol-chart-area { fill: var(--primary-blue); opacity: 0.08; }
        .vol-chart-axis-text { fill: var(--text-mute); font-size: 10px; }
        .vol-chart-dot { fill: var(--primary-blue); cursor: pointer; }
        .vol-chart-dot:hover { fill: var(--down-color); }
        .vol-chart-grid { stroke: var(--border-color); stroke-width: 1; }
        .vol-chart-tooltip {
            position: fixed;
            pointer-events: none;
            background: var(--text-main);
            color: var(--card-bg);
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            z-index: 200;
            display: none;
        }
        .vol-chart-wrap { position: relative; }
        .vol-chart-summary {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 8px;
        }
        .vol-chart-summary b { color: var(--text-main); }

        /* ── 成交额趋势 Modal：可调节大小 ── */
        .modal-box.resizable {
            display: flex;
            flex-direction: column;
            position: relative;
            resize: none;
            overflow: hidden;
        }
        .modal-box.resizable #volChartBody { flex: 1 1 auto; overflow: auto; }
        .modal-box.resizable .vol-chart-svg { height: 100%; min-height: 160px; }
        .modal-box.resizable .vol-chart-wrap { height: calc(100% - 26px); }
        .modal-resize-handle {
            position: absolute;
            right: 0; bottom: 0;
            width: 18px; height: 18px;
            cursor: nwse-resize;
            z-index: 2;
        }
        .modal-resize-handle::after {
            content: '';
            position: absolute;
            right: 3px; bottom: 3px;
            width: 9px; height: 9px;
            border-right: 2px solid var(--text-mute);
            border-bottom: 2px solid var(--text-mute);
            opacity: 0.6;
        }
        .modal-resize-handle:hover::after { opacity: 1; border-color: var(--primary-blue); }

        /* ── 笔记功能 ── */
        .notes-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }
        .notes-sync-status { font-size: 11px; color: var(--text-mute); }
        .notes-sync-status.ok   { color: var(--up-color); }
        .notes-sync-status.err  { color: var(--down-color); }

        #notesListBody { max-height: 320px; overflow-y: auto; margin-bottom: 10px; }
        .note-item {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-main);
            background: var(--panel-bg);
        }
        .note-item-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .note-item-time { font-size: 11px; color: var(--text-mute); }
        .note-item-actions { display: flex; gap: 8px; }
        .note-item-actions span { cursor: pointer; font-size: 11px; color: var(--text-sub); }
        .note-item-actions span:hover { color: var(--primary-blue); }
        .note-item-actions span.danger:hover { color: var(--down-color); }
        .note-item-body { white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
        .note-item-body textarea {
            width: 100%;
            font-size: 13px;
            font-family: inherit;
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--card-bg);
            color: var(--text-main);
            resize: vertical;
        }
        .note-empty-tip { color: var(--text-mute); font-size: 12px; font-style: italic; text-align: center; padding: 16px 0; }

        .note-edit-row { display: flex; gap: 6px; align-items: flex-end; }
        .note-edit-row textarea {
            flex: 1;
            font-size: 13px;
            font-family: inherit;
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--card-bg);
            color: var(--text-main);
            resize: vertical;
        }

        .gist-config-body { display: flex; flex-direction: column; gap: 6px; }
        .gist-field-label { font-size: 12px; color: var(--text-sub); margin-top: 6px; }
        .gist-config-body input[type="text"] {
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 12px;
            background: var(--card-bg);
            color: var(--text-main);
        }
        .gist-config-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

        /* ── 快捷链接编辑 ── */
        #quickLinkEditListBody { max-height: 260px; overflow-y: auto; margin-bottom: 10px; }
        .quick-link-edit-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 13px;
            background: var(--panel-bg);
        }
        .quick-link-edit-item .qle-name { font-weight: 600; color: var(--text-main); flex-shrink: 0; }
        .quick-link-edit-item .qle-url { color: var(--text-sub); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .quick-link-edit-item .qle-del { cursor: pointer; color: var(--text-mute); font-size: 12px; }
        .quick-link-edit-item .qle-del:hover { color: var(--down-color); }
        .quick-link-edit-row { display: flex; gap: 6px; }
        .quick-link-edit-row input[type="text"] {
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 12px;
            background: var(--card-bg);
            color: var(--text-main);
        }

        /* ── 标的右键菜单 ── */
        .row-ctx-menu {
            position: fixed;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.16);
            padding: 4px;
            z-index: 30;
            min-width: 120px;
        }

        .row-ctx-menu .ctx-item {
            padding: 7px 12px;
            font-size: 13px;
            color: var(--text-main);
            cursor: pointer;
            border-radius: 5px;
            white-space: nowrap;
        }

        .row-ctx-menu .ctx-item:hover { background: var(--hover-bg); }
        .row-ctx-menu .ctx-item.danger:hover { background: #fdecea; color: var(--down-color); }

        /* ── 列可见性控制面板 ── */
        .col-panel {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 6px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            padding: 10px 14px;
            z-index: 20;
            min-width: 140px;
        }

        .col-panel label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 400;
            padding: 4px 0;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-main);
        }

        .col-toggle-wrap { position: relative; display: inline-block; }

        .col-panel-divider { border-top: 1px solid var(--border-color); margin: 8px 0; }

        .custom-col-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 0;
            font-size: 12px;
            white-space: nowrap;
        }

        .custom-col-row input[type="number"] {
            width: 56px;
            padding: 3px 6px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 12px;
            text-transform: none;
        }

        .color-swatch {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .color-swatch.reset {
            background: #fff;
            position: relative;
        }

        .color-swatch.reset::after {
            content: '✕';
            position: absolute;
            inset: 0;
            font-size: 9px;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="top-bar-links" id="quickLinksBar"></div>
        <h2 style="margin:0">实时行情</h2>
        <div class="top-bar-actions">
            <button class="sort-btn" onclick="openQuickLinkEditModal()">🔗 链接</button>
            <button class="sort-btn" onclick="openGlobalSyncModal()">☁️ 同步</button>
            <button id="themeToggleBtn" class="sort-btn" onclick="toggleTheme()">🌙 暗色</button>
        </div>
    </div>

    <!-- ── 交易所行情面板 ── -->
    <div id="mainPanel">
        <div class="toolbar">
            <label>添加标的:</label>
            <input type="text" id="addInput" placeholder="输入如: BTC" onkeydown="if(event.key==='Enter')addSymbol()">
            <!-- 指定交易所 -->
            <select id="addExchange" aria-label="选择交易所" style="padding:6px 8px;border:1px solid var(--border-color);border-radius:4px;font-size:12px;background:var(--card-bg);color:var(--text-main)">
                <option value="">自动（优先Bitget）</option>
                <option value="bitget">BG现货</option>
                <option value="bitget-futures">BG合约</option>
                <option value="binance">币安</option>
                <option value="binance-chain">币安链上(Alpha)</option>
                <option value="okx">OKX</option>
                <option value="gate">Gate</option>
                <option value="mexc">抹茶(MEXC)</option>
            </select>
            <button class="sort-btn" onclick="addSymbol()">添加</button>

            <div class="col-toggle-wrap" style="margin-left:auto">
                <button class="sort-btn" onclick="toggleColPanel(event)">列显示 ▾</button>
                <div id="colPanel" class="col-panel" style="display:none"></div>
            </div>
        </div>

        <table id="mainTable">
            <thead><tr id="theadRow"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>

        <div class="refresh-tag" id="statusLine">正在加载行情数据...</div>
    </div>
</div>

<!-- ── K线详情 Modal ── -->
<div id="detailModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeDetail()">
    <div class="modal-box">
        <div class="modal-header">
            <span id="detailTitle"></span>
            <span class="modal-close" onclick="closeDetail()">✕</span>
        </div>
        <div class="modal-range-group" id="detailRangeGroup"></div>
        <div id="detailBody">加载中...</div>
    </div>
</div>

<!-- ── 标的右键菜单 ── -->
