    async function fetchHKStock(id, sym, code) {
        const yahooCode = code.replace(/^0+/, '') + '.HK';
        try {
            const resp = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${yahooCode}?interval=1d&range=2d`, { headers: { 'Accept': 'application/json' } });
            const json = await resp.json();
            const r = json?.chart?.result?.[0];
            if (r) {
                const meta = r.meta;
                const price  = meta.regularMarketPrice;
                const prev   = meta.chartPreviousClose || meta.previousClose;
                const high   = meta.regularMarketDayHigh;
                const low    = meta.regularMarketDayLow;
                const vol    = meta.regularMarketVolume * price / 1e8;
                const change = prev > 0 ? (price - prev) / prev * 100 : 0;
                const amp    = prev > 0 ? (high - low) / prev * 100 : 0;
                cache[id] = { price: price.toFixed(2), change, amp, vol, mktcap: null, high: high.toFixed(2), low: low.toFixed(2), source: 'hk' };
                // 继续尝试获取市值
            }
        } catch {}

        try {
            const resp = await fetch(`https://qt.gtimg.cn/q=r_hk${code}`);
            const text = await resp.text();
            const m = text.match(/="([^"]+)"/);
            if (m) {
                const parts = m[1].split('~');
                const price  = parseFloat(parts[3]);
                const prev   = parseFloat(parts[4]);
                const high   = parseFloat(parts[33]);
                const low    = parseFloat(parts[34]);
                const vol    = parseFloat(parts[6] || 0) * price / 1e8;
                const change = prev > 0 ? (price - prev) / prev * 100 : 0;
                const amp    = prev > 0 ? (high - low) / prev * 100 : 0;
                const mktcap = parseFloat(parts[45]) * 0.13; // 粗略转 USD
                if (price > 0) {
                    cache[id] = { price: price.toFixed(2), change, amp, vol, mktcap, high: high.toFixed(2), low: low.toFixed(2), source: 'hk' };
                    return;
                }
            }
        } catch {}

        try {
            const sinaCode = 'hk' + code;
            const resp = await fetch(`https://hq.sinajs.cn/list=${sinaCode}`, { headers: { Referer: 'https://finance.sina.com.cn' } });
            const text = await resp.text();
            const m = text.match(/"([^"]+)"/);
            if (m) {
                const parts = m[1].split(',');
                const price  = parseFloat(parts[3] || parts[6]);
                const prev   = parseFloat(parts[2]);
                const high   = parseFloat(parts[4]);
                const low    = parseFloat(parts[5]);
                const vol    = parseFloat(parts[12] || 0) * price / 1e8;
                const change = prev > 0 ? (price - prev) / prev * 100 : 0;
                const amp    = prev > 0 ? (high - low) / prev * 100 : 0;
                if (price > 0) { cache[id] = { price: price.toFixed(2), change, amp, vol, mktcap: null, high: high.toFixed(2), low: low.toFixed(2), source: 'hk' }; return; }
            }
        } catch {}
        delete cache[id];
    }

    async function fetchCNStock(id, sym, code) {
        try {
            const resp = await fetch(`https://qt.gtimg.cn/q=${code.toLowerCase()}`);
            const text = await resp.text();
            const m = text.match(/="([^"]+)"/);
            if (m) {
                const parts = m[1].split('~');
                const price  = parseFloat(parts[3]);
                const prev   = parseFloat(parts[4]);
                const high   = parseFloat(parts[33]);
                const low    = parseFloat(parts[34]);
                const vol    = parseFloat(parts[6] || 0) * price / 1e8;
                const change = prev > 0 ? (price - prev) / prev * 100 : 0;
                const amp    = prev > 0 ? (high - low) / prev * 100 : 0;
                const mktcap = parseFloat(parts[45]) * 0.14; // 粗略转 USD
                if (price > 0) {
                    cache[id] = { price: price.toFixed(2), change, amp, vol, mktcap, high: high.toFixed(2), low: low.toFixed(2), source: 'cn' };
                    return;
                }
            }
        } catch {}
        try {
            const sinaCode = code.toLowerCase();
            const resp = await fetch(`https://hq.sinajs.cn/list=${sinaCode}`, { headers: { Referer: 'https://finance.sina.com.cn' } });
            const text = await resp.text();
            const m = text.match(/"([^"]+)"/);
            if (m) {
                const parts = m[1].split(',');
                const price  = parseFloat(parts[3]);
                const prev   = parseFloat(parts[2]);
                const high   = parseFloat(parts[4]);
                const low    = parseFloat(parts[5]);
                const vol    = parseFloat(parts[8] || 0) * price / 1e8;
                const change = prev > 0 ? (price - prev) / prev * 100 : 0;
                const amp    = prev > 0 ? (high - low) / prev * 100 : 0;
                if (price > 0) { cache[id] = { price: price.toFixed(2), change, amp, vol, mktcap: null, high: high.toFixed(2), low: low.toFixed(2), source: 'cn' }; return; }
            }
        } catch {}
        try {
            const resp = await fetch(`https://qt.gtimg.cn/q=${code.toLowerCase()}`);
            const text = await resp.text();
            const m = text.match(/="([^"]+)"/);
            if (m) {
                const parts = m[1].split('~');
                const price  = parseFloat(parts[3]);
                const prev   = parseFloat(parts[4]);
                const high   = parseFloat(parts[33]);
                const low    = parseFloat(parts[34]);
                const vol    = parseFloat(parts[6] || 0) * price / 1e8;
                const change = prev > 0 ? (price - prev) / prev * 100 : 0;
                const amp    = prev > 0 ? (high - low) / prev * 100 : 0;
                if (price > 0) { cache[id] = { price: price.toFixed(2), change, amp, vol, mktcap: null, high: high.toFixed(2), low: low.toFixed(2), source: 'cn' }; return; }
            }
        } catch {}
        delete cache[id];
    }

    // ── 流通量 & 市值 ─────────────────────────────────────────────
    const CIRCULATING_SUPPLY = {
        BTC: 19800000, ETH: 120000000, RSKHY: 7289000000, SKHY: 7289000000, MRVL: 875000000,
         BNB: 140000000, SOL: 490000000, SKHYNIX: 708300000,
        DOGE: 146000000000, GRAM: 2500000000, ONDO: 486900000000, SHIB: 589000000000000,
        UNI: 600000000, SUI: 3100000000, HYPE: 254000000, BGB: 700000000,
        MU: 1200000000, OKB: 21000000, MATIC: 10000000000, AVAX: 410000000,
        LINK: 600000000, DOT: 1400000000, ADA: 35000000000, XRP: 57000000000,
        LTC: 74000000, BCH: 19700000, ATOM: 390000000, FIL: 580000000,
        APT: 540000000, ARB: 3900000000, OP: 1200000000,
        SPCX: 11923076920, PREOPAI: 1241290000, 茅台: 1252270215 * 0.15,
        ARTX: 42400000, 币安人生: 1000000000, DYDX: 41650000, 小米: 25922000000 * 0.13,
      NVDA: 24300000000, AAPL: 14776000000, GOOGL: 12097000000, TSLA: 3752000000, SNDK: 148089800,
    };

    const PRE_SALE_SYMBOLS = { SPCX: 'SPCXUSDT', PREOPAI: 'PREOPAIUSDT' };

    async function fetchPreSaleMktcap(sym) {
        const bgSym = PRE_SALE_SYMBOLS[sym];
        if (!bgSym) return null;
        const paths = [`/v1/spot/market/overview?symbol=${bgSym}`, `/v1/spot/market-overview?symbol=${bgSym}`];
        for (const path of paths) {
            try {
                const resp = await fetch(`https://www.bitget.com${path}`, { headers: { 'Accept': 'application/json', 'Referer': `https://www.bitget.com/spot/${bgSym}` } });
                const json = await resp.json();
                if (json.code === '00000' && json.data) {
                    const mc = parseFloat(json.data.marketCap || json.data.market_cap || 0);
                    if (mc > 0) return mc / 10000;
                }
            } catch {}
        }
        return null;
    }

    async function fetchDynamicSupply(sym) {
        if (DYNAMIC_SUPPLY[sym]) return DYNAMIC_SUPPLY[sym];
        try {
            const s = apiSym(sym).toUpperCase();
            const resp = await fetch(`https://api.gateio.ws/api/v4/spot/currencies/${s}`);
            const json = await resp.json();
            if (json.total_supply || json.market_cap) {
                const supply = parseFloat(json.total_supply || 0);
                if (supply > 0) {
                    DYNAMIC_SUPPLY[sym] = supply;
                    return supply;
                }
                const mktcap = parseFloat(json.market_cap || 0);
                const price = cache[Object.keys(cache).find(k => k.startsWith(sym + '@'))]?.price;
                if (mktcap > 0 && price > 0) {
                    const derivedSupply = mktcap / parseFloat(price);
                    DYNAMIC_SUPPLY[sym] = derivedSupply;
                    return derivedSupply;
                }
            }
        } catch {}
        return null;
    }

    function calcMktcap(id, sym) {
        const supply = CIRCULATING_SUPPLY[apiSym(sym)] || CIRCULATING_SUPPLY[sym] || DYNAMIC_SUPPLY[sym];
        if (!supply || !cache[id]) return null;
        return parseFloat(cache[id].price) * supply / 10000;
    }

    function updateAllMktcap() {
        rows.forEach(async row => {
            if (!cache[row.id]) return;
            let mc = calcMktcap(row.id, row.sym);
            if (mc == null) {
                const supply = await fetchDynamicSupply(row.sym);
                if (supply) mc = calcMktcap(row.id, row.sym);
            }
            if (mc != null) cache[row.id].mktcap = mc;
        });
    }

    async function updatePreSaleMktcap() {
        await Promise.all(rows.map(async row => {
            if (!cache[row.id]) return;
            if (cache[row.id].mktcap != null) return;
            const mc = await fetchPreSaleMktcap(row.sym);
            if (mc != null && cache[row.id]) cache[row.id].mktcap = mc;
        }));
    }

    // ── Add / Remove ──────────────────────────────────────────────
    function addSymbol() {
        const input = document.getElementById('addInput');
        const exchSel = document.getElementById('addExchange');
        const raw = input.value.trim();
        if (!raw) return;
        const sym = /^[一-龥]/.test(raw) ? raw : raw.toUpperCase().replace(/USDT$/, '');
        const exchange = exchSel.value; // '' | 'bitget' | 'bitget-futures' | 'binance' | 'binance-chain' | 'okx' | 'gate' | 'mexc'
        const id = sym + '@' + (exchange || 'auto') + '_' + Date.now();

        input.value = '';
        rows.push({ id, sym, exchange, pinned: true });
        renderTable();
        autoSyncSettingsToGist();

        const doFetch = async () => {
            await fetchRow({ id, sym, exchange });
            if (cache[id] && exchange !== 'binance-chain') {
                cache[id].mktcap = calcMktcap(id, sym);
                if (cache[id].mktcap == null && PRE_SALE_SYMBOLS[sym]) {
                    const mc = await fetchPreSaleMktcap(sym);
                    if (mc != null && cache[id]) { cache[id].mktcap = mc; renderTable(); }
                }
            }
            renderTable();
        };
        doFetch();
    }

    function removeRow(id) {
        rows = rows.filter(r => r.id !== id);
        delete cache[id];
        renderTable();
        autoSyncSettingsToGist();
    }

    // ── Init ──────────────────────────────────────────────────────
    Object.keys(STOCK_MAP).forEach(name => {
        if (!rows.find(r => r.sym === name)) rows.push({ id: name + '@auto', sym: name, exchange: '', pinned: false });
    });

    renderHeader();
    renderTable();
    renderQuickLinksBar();
    fetchAll();
    setInterval(fetchAll, 3000);
</script>

<script>
    (function () {
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                }
            } catch (e) { /* ignore */ }
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') requestWakeLock();
        });
        requestWakeLock();

        if (!('wakeLock' in navigator)) {
            const video = document.createElement('video');
            video.setAttribute('playsinline', '');
            video.setAttribute('muted', '');
            video.muted = true;
            video.loop = true;
            video.style.position = 'fixed';
            video.style.width = '1px';
            video.style.height = '1px';
            video.style.opacity = '0';
            video.style.pointerEvents = 'none';
            video.src = 'data:video/mp4;base64,AAAAHGZ0eXBpc29tAAACAGlzb21pc28yYXZjMQAAAAhmcmVlAAAC7W1kYXQAAAAvZ8fPh0+HAAAAB6cUCBFTNRZOb/jmz1DbAsyKlfmzz9NAvgygxvfPvhAcXTd0YhAAAAA=';
            video.play().catch(() => {});
            document.body.appendChild(video);
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') video.play().catch(() => {});
            });
        }
    })();
</script>
