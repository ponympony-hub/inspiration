<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵感泡泡面板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 30% 20%, #14213d 0%, #0b1426 55%, #060b16 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    #canvas-container {
      flex: 1;
      position: relative;
      width: 100%;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }

    /* 顶部悬浮感应带：鼠标靠近屏幕顶部即可唤出工具栏，平时不占视觉空间 */
    #hover-zone {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 90px;
      z-index: 19;
    }

    /* 顶部工具条：默认隐藏，鼠标靠近顶部或悬停时淡入 */
    #topbar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #topbar.revealed {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    #tip {
      color: rgba(148, 163, 184, 0.85);
      font-size: 13px;
      line-height: 1.6;
      pointer-events: none;
    }
    #tip b { color: #93c5fd; }
    #toolbar {
      display: flex;
      gap: 8px;
    }
    .tool-btn {
      background: rgba(19, 30, 49, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .tool-btn:hover { background: rgba(59, 130, 246, 0.35); transform: translateY(-1px); }
    .tool-btn.danger:hover { background: rgba(239, 68, 68, 0.4); }
    .tool-btn.active { background: rgba(59, 130, 246, 0.45); border-color: #3b82f6; }
    #counter {
      color: rgba(148,163,184,0.9);
      font-size: 12px;
      align-self: center;
      margin-right: 4px;
      white-space: nowrap;
    }
    .slider-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(19, 30, 49, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 6px 12px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
    }
    .slider-group label {
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
    }
    .slider-group input[type="range"] {
      width: 90px;
      accent-color: #3b82f6;
      cursor: pointer;
    }
    .slider-group .slider-val {
      font-size: 11px;
      color: #64748b;
      width: 30px;
      text-align: right;
    }

    /* 垃圾桶热区 */
    #trash-zone {
      position: absolute;
      top: 70px;
      left: 16px;
      width: 84px;
      height: 84px;
      border-radius: 20px;
      background: rgba(239, 68, 68, 0.12);
      border: 2px dashed rgba(239, 68, 68, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      z-index: 25;
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s, background 0.18s, border-color 0.18s;
    }
    #trash-zone.visible { opacity: 1; transform: scale(1); }
    #trash-zone.armed {
      background: rgba(239, 68, 68, 0.35);
      border-color: #ef4444;
      transform: scale(1.15);
    }

    /* 撤销 toast */
    #toast {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 30;
      background: rgba(19, 30, 49, 0.95);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 10px 14px;
      display: none;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    #toast.visible { display: flex; }
    #toast button {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    #toast button:hover { background: #2563eb; }
    #toast-text { color: #cbd5e1; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 悬浮详情提示 */
    #hover-tooltip {
      position: absolute;
      z-index: 35;
      display: none;
      max-width: 260px;
      background: rgba(10, 16, 28, 0.96);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.55);
      pointer-events: none;
    }
    #hover-tooltip.visible { display: block; }
    #hover-tooltip .tt-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      word-break: break-word;
    }
    #hover-tooltip .tt-divider {
      border-top: 1px solid rgba(255,255,255,0.15);
      margin: 6px 0;
    }
    #hover-tooltip .tt-detail {
      font-size: 12.5px;
      color: #cbd5e1;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #hover-tooltip .tt-meta {
      font-size: 10.5px;
      color: #64748b;
      margin-top: 6px;
    }

    /* 双击编辑浮层 */
    #edit-panel {
      position: absolute;
      z-index: 40;
      display: none;
      flex-direction: column;
      gap: 8px;
      background: rgba(15, 23, 42, 0.97);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
      width: 260px;
    }
    #edit-panel.visible { display: flex; }
    #edit-text {
      width: 100%;
      min-height: 48px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: white;
      font-size: 14px;
      padding: 8px;
      resize: none;
      outline: none;
      font-family: inherit;
    }
    #edit-text:focus, #edit-detail:focus { border-color: #3b82f6; }
    #edit-detail-label {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }
    #edit-detail {
      width: 100%;
      min-height: 64px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: white;
      font-size: 13px;
      padding: 8px;
      resize: none;
      outline: none;
      font-family: inherit;
    }
    #edit-link-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #edit-url {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: white;
      font-size: 12px;
      padding: 7px 10px;
      outline: none;
      font-family: inherit;
    }
    #edit-url:focus { border-color: #3b82f6; }
    #edit-open-link {
      background: rgba(59, 130, 246, 0.25);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    #edit-open-link:hover { background: rgba(59, 130, 246, 0.4); }
    #edit-colors {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    #edit-colors .color-dot { width: 26px; height: 26px; }
    #edit-rainbow-input {
      position: absolute;
      opacity: 0;
      width: 26px;
      height: 26px;
      cursor: pointer;
    }
    #edit-category-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    #edit-category-row .cat-choice {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 11.5px;
      cursor: pointer;
    }
    #edit-category-row .cat-choice.active {
      background: rgba(59, 130, 246, 0.4);
      border-color: #3b82f6;
      color: #fff;
    }
    #edit-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #edit-lock {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #e2e8f0;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    #edit-lock.locked { background: rgba(250, 204, 21, 0.25); border-color: #facc15; color: #facc15; }
    #edit-done {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    #edit-done:hover { background: #2563eb; }

    /* 底部悬浮感应带：鼠标靠近屏幕底部即可唤出输入框，平时不占视觉空间 */
    #input-hover-zone {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100px;
      z-index: 9;
    }
    #input-container {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      z-index: 10;
      background: rgba(19, 30, 49, 0.85);
      padding: 12px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      width: 45%;
      max-width: 339px;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #input-container.revealed {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      padding: 8px 16px;
      font-size: 16px;
    }
    input::placeholder { color: #64748b; }
    #btn-confirm-add {
      background: #3b82f6;
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    #btn-confirm-add:hover { background: #2563eb; }
    #color-picker {
      display: flex;
      gap: 6px;
      padding-right: 6px;
      align-items: center;
      position: relative;
    }
    .color-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.12s, border-color 0.12s;
      flex-shrink: 0;
    }
    .color-dot:hover { transform: scale(1.15); }
    .color-dot.selected { border-color: #fff; }
    .color-dot.rainbow {
      background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
      position: relative;
    }
    .color-dot.random-dot {
      background: conic-gradient(red, orange, yellow, lime, cyan, blue, violet, red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #101828;
      text-shadow: 0 0 2px rgba(255,255,255,0.6);
    }
    #rainbow-input {
      position: absolute;
      opacity: 0;
      width: 22px;
      height: 22px;
      left: 0;
      top: 0;
      cursor: pointer;
    }

    /* 透明度垂直滑杆：0(全透明)~10(不透明) */
    .alpha-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      height: 60px;
      justify-content: center;
    }
    .alpha-slider {
      writing-mode: vertical-lr;
      direction: rtl;
      -webkit-appearance: slider-vertical;
      width: 20px;
      height: 46px;
      cursor: pointer;
      accent-color: #94a3b8;
      flex-shrink: 0;
      margin: 0;
    }
    .alpha-val {
      font-size: 10px;
      color: #94a3b8;
      line-height: 1;
      min-width: 14px;
      text-align: center;
    }
    #edit-colors .alpha-wrap { height: 70px; }
    #edit-colors .alpha-slider { height: 54px; }

    /* 右侧悬浮感应带：鼠标靠近屏幕右边即可唤出气泡大小滑杆，平时不占视觉空间 */
    #size-hover-zone {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 90px;
      z-index: 9;
    }
    #size-panel {
      position: absolute;
      top: 50%;
      right: 18px;
      transform: translateY(-50%) translateX(10px);
      z-index: 10;
      background: rgba(19, 30, 49, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #size-panel.revealed {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
      pointer-events: auto;
    }
    #size-panel label {
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
    }
    #sizeSlider {
      writing-mode: vertical-lr;
      direction: rtl;
      -webkit-appearance: slider-vertical;
      width: 20px;
      height: 120px;
      cursor: pointer;
      accent-color: #3b82f6;
      margin: 4px 0;
    }
    #size-panel .slider-val {
      font-size: 11px;
      color: #64748b;
    }

    /* 左侧悬浮感应带：鼠标靠近屏幕左边即可唤出分类栏，平时不占视觉空间 */
    #category-hover-zone {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 180px;
      z-index: 9;
    }
    #category-panel {
      position: absolute;
      top: 50%;
      left: 18px;
      transform: translateY(-50%) translateX(-10px);
      z-index: 10;
      background: rgba(19, 30, 49, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #category-panel.revealed {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
      pointer-events: auto;
    }
    #category-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 0;
    }
    /* Dock 式扇形放大：每个 tab 的缩放/位移由 JS 按鼠标距离实时写入 --dock-scale，
       transform-origin 定在左侧，让放大时向右侧（画布方向）鼓出，而不会挤到面板外面 */
    .category-tab {
      --dock-scale: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #cbd5e1;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 12.5px;
      cursor: pointer;
      white-space: nowrap;
      transform-origin: left center;
      transform: scale(var(--dock-scale));
      transition: background 0.15s, border-color 0.15s, transform 0.12s ease-out;
      will-change: transform;
    }
    .category-tab:hover, .category-tab.active { background: color-mix(in srgb, var(--cat-color) 35%, rgba(255,255,255,0.06)); border-color: var(--cat-color); }
    .category-tab.active { color: #fff; box-shadow: 0 0 0 1px var(--cat-color) inset; }
    .category-tab.drop-armed { background: rgba(34, 197, 94, 0.35); border-color: #22c55e; }
    .category-tab .cat-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cat-color);
      flex-shrink: 0;
      box-shadow: 0 0 6px var(--cat-color);
    }
    .category-tab .cat-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .category-tab .cat-edit {
      font-size: 11px;
      opacity: 0;
      transition: opacity 0.12s;
      flex-shrink: 0;
    }
    .category-tab:hover .cat-edit { opacity: 0.8; }
    .category-tab .cat-name-input {
      flex: 1;
      width: 60px;
      background: rgba(255,255,255,0.1);
      border: 1px solid #3b82f6;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      padding: 2px 4px;
      outline: none;
      font-family: inherit;
    }
    .category-tab .cat-delete {
      font-size: 11px;
      color: #f87171;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.12s;
    }
    .category-tab:hover .cat-delete { opacity: 0.8; }
    #category-add-btn {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #category-add-btn:hover { background: rgba(59, 130, 246, 0.4); }
    #category-add-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    #category-add-btn.editing {
      display: flex;
    }
    .category-add-input {
      width: 100%;
      background: rgba(255,255,255,0.1);
      border: 1px solid #3b82f6;
      border-radius: 12px;
      color: #fff;
      font-size: 12px;
      padding: 6px 8px;
      outline: none;
      font-family: inherit;
    }

    /* 隔离网格：横竖两条可拖拽分隔线 */
    #grid-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 15;
      display: none;
      pointer-events: none;
    }
    #grid-overlay.visible { display: block; }
    #grid-line-v, #grid-line-h {
      position: absolute;
      pointer-events: auto;
      background: transparent;
    }
    #grid-line-v {
      top: 0; bottom: 0;
      width: 12px;
      margin-left: -6px;
      cursor: col-resize;
    }
    #grid-line-h {
      left: 0; right: 0;
      height: 12px;
      margin-top: -6px;
      cursor: row-resize;
    }
    #grid-line-v::before, #grid-line-h::before {
      content: '';
      position: absolute;
      background: rgba(148, 163, 184, 0.5);
      border-left: 2px dashed rgba(148, 163, 184, 0.7);
    }
    #grid-line-v::before {
      left: 6px; top: 0; bottom: 0; width: 0;
    }
    #grid-line-h::before {
      top: 6px; left: 0; right: 0; height: 0;
      border-left: none;
      border-top: 2px dashed rgba(148, 163, 184, 0.7);
    }
    #grid-line-v.dragging::before, #grid-line-h.dragging::before {
      border-color: #3b82f6;
    }

    /* 象限标签：贴着十字交点四周显示，随分隔线拖动实时跟随；双击可改名 */
    .quadrant-label {
      position: absolute;
      pointer-events: auto;
      background: rgba(19, 30, 49, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      color: #e2e8f0;
      font-size: 12px;
      padding: 4px 9px;
      border-radius: 10px;
      white-space: nowrap;
      cursor: text;
      backdrop-filter: blur(6px);
      user-select: none;
    }
    .quadrant-label-input {
      position: absolute;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      border: 1px solid #3b82f6;
      color: #fff;
      outline: none;
      font-family: inherit;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="hover-zone"></div>
<div id="topbar">
  <div id="tip"> 📌 双击编辑<br> 👋 拖动删除</div>
  <div id="toolbar">
    <span id="counter">0 个灵感</span>
    <div class="slider-group">
      <label for="speedSlider">🚀 速度</label>
      <input type="range" id="speedSlider" min="0" max="200" value="100">
      <span class="slider-val" id="speedVal">100%</span>
    </div>
    <div class="slider-group">
      <label for="textRatioSlider">🔠 文字</label>
      <input type="range" id="textRatioSlider" min="60" max="130" value="100">
